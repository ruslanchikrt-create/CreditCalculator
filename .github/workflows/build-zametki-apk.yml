name: Build Notes Widget APK
on:
  push:
    branches: [build-zametki-apk-20261117]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          mkdir -p build-notes
          base64 -d source_apk.b64 | tar -xJ -C build-notes
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: build-notes
        run: gradle --no-daemon assembleDebug
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s build-notes/app/build/outputs/apk/debug/app-debug.apk
          cp build-notes/app/build/outputs/apk/debug/app-debug.apk zametki-widget.apk
          gh release create zametki-widget-1.0 zametki-widget.apk --title 'Заметки — Android-виджет 1.0' --notes 'Android 8+, заметки, виджет, напоминания' --target "${GITHUB_SHA}" || gh release upload zametki-widget-1.0 zametki-widget.apk --clobber
