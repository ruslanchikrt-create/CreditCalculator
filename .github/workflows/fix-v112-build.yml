name: Fix v1.12 build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Java string literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/creditcalculator/ReminderScheduler.java')
          s=p.read_text(encoding='utf-8')

          start=s.index('    public static void applyEarlyRepayment(Context c,long id,long date,double prepayment,boolean reduceTerm,double customPayment,int customMonths)')
          end=s.index('\n\n    public static RefinanceSimulation simulateRefinance', start)
          method=r'''    public static void applyEarlyRepayment(Context c,long id,long date,double prepayment,boolean reduceTerm,double customPayment,int customMonths){
        List<PaymentReminder> items=loadAll(c);
        for(PaymentReminder r:items) if(r.id==id){
            EarlyRepaymentSimulation sim=simulateEarlyRepayment(r,date,prepayment);
            cancel(c,r);
            double oldPayment=paymentAmount(r,Math.max(0,nextPaymentIndex(r)));
            int oldMonths=Math.max(1,remainingPaymentsAfterDate(r,date));
            double oldRate=r.annualRate;
            double trackedPaid=trackedSegmentPaid(r);
            double trackedRemaining=Math.max(0,r.progressTrackPrincipal-trackedPaid);
            r.progressRepaidBefore=Math.min(progressOriginalPrincipal(r),r.progressRepaidBefore+trackedPaid);
            double trackedPrepay=Math.min(sim.prepayment,trackedRemaining);
            r.progressRepaidBefore=Math.min(progressOriginalPrincipal(r),r.progressRepaidBefore+trackedPrepay);
            r.progressTrackPrincipal=Math.max(0,trackedRemaining-trackedPrepay);
            r.interestPaidBefore+=segmentPaidInterest(r);
            r.updatedAt=System.currentTimeMillis();
            String before="Остаток до погашения: "+round2(sim.balance)+" ₽\nДосрочно внесено: "+round2(sim.prepayment)+" ₽";
            double saving;
            int afterMonths;
            double afterPayment;
            if(sim.newBalance<=.01){
                saving=sim.oldRemainingInterest;
                r.progressRepaidBefore=progressOriginalPrincipal(r);
                r.progressTrackPrincipal=0;
                r.principal=0;r.amount=0;r.firstPaymentMillis=date;r.months=1;
                r.ledgerJson="";r.ledgerCache=new ArrayList<>();r.partsCache=null;r.status=STATUS_ARCHIVE;
                afterMonths=0;afterPayment=0;
                appendHistory(r,r.updatedAt,HISTORY_EARLY,"Полное досрочное погашение","Full early repayment",
                        before+"\nКредит полностью погашен.\nЭкономия на процентах: "+round2(saving)+" ₽",
                        "Loan fully repaid. Estimated interest saving: "+round2(saving)+" ₽");
            }else{
                r.principal=sim.newBalance;r.firstPaymentMillis=sim.firstFuturePayment;
                r.ledgerJson="";r.ledgerCache=new ArrayList<>();r.partsCache=null;
                if(reduceTerm){
                    r.months=customMonths>0?customMonths:Math.max(1,sim.reducedMonths);
                    r.amount=customPayment>0?customPayment:sim.keptPayment;
                    saving=sim.savingsWithReducedTerm;
                    appendHistory(r,r.updatedAt,HISTORY_EARLY,"Досрочное погашение","Early repayment",
                            before+"\nВыбрано: сократить срок.\nНовый срок: "+r.months+" мес.\nНовый платёж: "+round2(r.amount)+" ₽\nЭкономия на процентах: "+round2(saving)+" ₽",
                            "Selected: reduce term. Estimated saving: "+round2(saving)+" ₽");
                }else{
                    r.months=customMonths>0?customMonths:Math.max(1,sim.remainingMonths);
                    r.amount=customPayment>0?customPayment:sim.reducedPayment;
                    saving=sim.savingsWithReducedPayment;
                    appendHistory(r,r.updatedAt,HISTORY_EARLY,"Досрочное погашение","Early repayment",
                            before+"\nВыбрано: уменьшить ежемесячный платёж.\nНовый платёж: "+round2(r.amount)+" ₽\nЭкономия на процентах: "+round2(saving)+" ₽",
                            "Selected: reduce payment. Estimated saving: "+round2(saving)+" ₽");
                }
                afterMonths=r.months;afterPayment=r.amount;
            }
            appendBenefit(r,r.updatedAt,HISTORY_EARLY,saving,sim.prepayment,oldPayment,afterPayment,oldMonths,afterMonths,oldRate,oldRate);
            saveRaw(c,items);
            if(STATUS_ACTIVE.equals(r.status))schedule(c,r);
            return;
        }
    }'''
          s=s[:start]+method+s[end:]

          start=s.index('    public static void applyRefinance(Context c,long id,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal,String paymentType)')
          end=s.index('\n\n    public static double annuity', start)
          method=r'''    public static void applyRefinance(Context c,long id,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal,String paymentType){
        List<PaymentReminder> items=loadAll(c);
        for(PaymentReminder r:items) if(r.id==id){
            RefinanceSimulation sim=simulateRefinance(r,date,newRate,newMonths,commission,insurance,requestedPrincipal,paymentType);
            cancel(c,r);
            double oldRate=r.annualRate;
            double oldPayment=paymentAmount(r,Math.max(0,nextPaymentIndex(r)));
            int oldMonths=sim.oldRemainingMonths;
            double trackedPaid=trackedSegmentPaid(r);
            double trackedRemaining=Math.max(0,r.progressTrackPrincipal-trackedPaid);
            r.progressRepaidBefore=Math.min(progressOriginalPrincipal(r),r.progressRepaidBefore+trackedPaid);
            if(sim.newPrincipal<trackedRemaining){
                r.progressRepaidBefore=Math.min(progressOriginalPrincipal(r),r.progressRepaidBefore+(trackedRemaining-sim.newPrincipal));
                r.progressTrackPrincipal=sim.newPrincipal;
            }else r.progressTrackPrincipal=trackedRemaining;
            r.interestPaidBefore+=segmentPaidInterest(r);
            r.principal=sim.newPrincipal;r.annualRate=newRate;r.months=newMonths;r.amount=sim.newPayment;
            r.paymentType=sim.paymentType;r.firstPaymentMillis=sim.firstNewPayment;
            r.ledgerJson="";r.ledgerCache=new ArrayList<>();r.partsCache=null;r.updatedAt=System.currentTimeMillis();
            appendHistory(r,r.updatedAt,HISTORY_REFINANCE,"Рефинансирование","Refinancing",
                    "Остаток: "+round2(sim.balance)+" ₽\nСтавка: "+round2(oldRate)+"% → "+round2(newRate)+"%\nТип платежей: "+sim.paymentType+
                    "\nПлатёж: "+round2(oldPayment)+" ₽ → "+round2(sim.newPayment)+" ₽\nСрок: "+oldMonths+" → "+newMonths+" мес.\nКомиссия: "+round2(commission)+
                    " ₽\nСтраховка: "+round2(insurance)+" ₽\nРасчётная экономия: "+round2(sim.savings)+" ₽",
                    "Refinancing applied. Payment type: "+sim.paymentType+". Estimated savings: "+round2(sim.savings)+" ₽");
            appendBenefit(r,r.updatedAt,HISTORY_REFINANCE,sim.savings,0,oldPayment,sim.newPayment,oldMonths,newMonths,oldRate,newRate);
            saveRaw(c,items);schedule(c,r);return;
        }
    }'''
          s=s[:start]+method+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator/ReminderScheduler.java
          git commit -m "Fix v1.12 Java strings"
          git push
