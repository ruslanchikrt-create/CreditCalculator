name: Hotfix Term Adapter Crash

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/hotfix-term-adapter.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply crash fix
        shell: python
        run: |
          from pathlib import Path
          import re

          add_path = Path('app/src/main/java/com/example/creditcalculator/AddReminderActivity.java')
          add = add_path.read_text(encoding='utf-8')
          add_pattern = r'''termUnitAdapter\s*=\s*new ArrayAdapter<>\(this,\s*android\.R\.layout\.simple_spinner_dropdown_item,\s*new String\[\]\{\s*UiUtils\.termUnit\(this,\s*1,\s*false\),\s*UiUtils\.termUnit\(this,\s*1,\s*true\)\s*\}\);'''
          add_replacement = '''termUnitAdapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item,
                  new java.util.ArrayList<>(java.util.Arrays.asList(
                          UiUtils.termUnit(this, 1, false),
                          UiUtils.termUnit(this, 1, true))));'''
          add, count = re.subn(add_pattern, add_replacement, add, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'AddReminderActivity replacement count: {count}')
          add_path.write_text(add, encoding='utf-8')

          main_path = Path('app/src/main/java/com/example/creditcalculator/MainActivity.java')
          main = main_path.read_text(encoding='utf-8')
          main_pattern = r'''return\s+new ArrayAdapter<>\(this,\s*android\.R\.layout\.simple_spinner_dropdown_item,\s*new String\[\]\{\s*UiUtils\.termUnit\(this,\s*value,\s*false\),\s*UiUtils\.termUnit\(this,\s*value,\s*true\)\s*\}\);'''
          main_replacement = '''return new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item,
                  new java.util.ArrayList<>(java.util.Arrays.asList(
                          UiUtils.termUnit(this, value, false),
                          UiUtils.termUnit(this, value, true))));'''
          main, count = re.subn(main_pattern, main_replacement, main, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'MainActivity replacement count: {count}')
          main_path.write_text(main, encoding='utf-8')

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 7', gradle, count=1)
          gradle = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.6"', gradle, count=1)
          gradle_path.write_text(gradle, encoding='utf-8')

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator/AddReminderActivity.java app/src/main/java/com/example/creditcalculator/MainActivity.java app/build.gradle
          git diff --cached --check
          git commit -m "Fix term selector runtime crash"
          git push
