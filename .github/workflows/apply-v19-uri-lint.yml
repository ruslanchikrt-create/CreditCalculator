name: Apply v1.9 URI lint fix

on:
  push:
    branches:
      - v1.9-work
    paths:
      - .github/v19-uri-fix-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.9-work
      - name: Fix persistable URI permission flags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/creditcalculator/SettingsActivity.java')
          s=p.read_text()
          old='''private void persist(Intent data,Uri u){try{getContentResolver().takePersistableUriPermission(u,data.getFlags()&(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_WRITE_URI_PERMISSION));}catch(Exception ignored){}}'''
          new='''private void persist(Intent data,Uri u){try{if((data.getFlags()&Intent.FLAG_GRANT_READ_URI_PERMISSION)!=0)getContentResolver().takePersistableUriPermission(u,Intent.FLAG_GRANT_READ_URI_PERMISSION);}catch(Exception ignored){}}'''
          if old not in s:
              raise SystemExit('persist target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator/SettingsActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "fix: persist only granted read URI permission"
          git push origin HEAD:v1.9-work
