name: Run v1.14 audited patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/apply-v114.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(lines) if "python - <<'PY'" in x)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          out=[]
          for line in lines[start:end]:
              out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_v114.py').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          python /tmp/apply_v114.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run math tests and build
        run: gradle testDebugUnitTest assembleDebug
      - name: Commit audited changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/build-apk.yml
          git commit -m "Audit financial math and reminders v1.14"
          git push
