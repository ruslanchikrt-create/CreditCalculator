name: Apply v1.13 changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('app/src/main/java/com/example/creditcalculator')

          # Main screen: the app launches into My payments and the savings card no longer lives on Calculators.
          p=root/'MainActivity.java'; s=p.read_text(encoding='utf-8')
          s=s.replace('benefitCard=buildBenefitCard();LinearLayout.LayoutParams bcp=new LinearLayout.LayoutParams(-1,-2);bcp.setMargins(0,0,0,dp(18));content.addView(benefitCard,bcp);','')
          old='setContentView(build());refreshProfile();refreshBenefit();}'
          new='setContentView(build());refreshProfile();refreshBenefit();if(b==null&&Intent.ACTION_MAIN.equals(getIntent().getAction())&&getIntent().hasCategory(Intent.CATEGORY_LAUNCHER)){startActivity(new Intent(this,PaymentsActivity.class));overridePendingTransition(0,0);}}'
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # My payments: savings card moved here; scheduled payments and early repayments are displayed separately.
          p=root/'PaymentsActivity.java'; s=p.read_text(encoding='utf-8')
          s=s.replace('List<ReminderScheduler.PaymentReminder> all=ReminderScheduler.load(this);listContainer.addView(summary(all));','List<ReminderScheduler.PaymentReminder> all=ReminderScheduler.load(this);listContainer.addView(benefitSummary(),benefitParams());listContainer.addView(summary(all));',1)
          marker='    private View controls()'
          if 'private View benefitSummary()' not in s:
              helper='''    private View benefitSummary(){MaterialCardView c=card();c.setClickable(true);c.setFocusable(true);c.setOnClickListener(v->startActivity(new Intent(this,BenefitHistoryActivity.class)));LinearLayout b=new LinearLayout(this);b.setOrientation(LinearLayout.VERTICAL);b.setPadding(dp(18),dp(15),dp(18),dp(15));c.addView(b);LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.HORIZONTAL);row.setGravity(Gravity.CENTER_VERTICAL);row.addView(text(AppPreferences.tr(this,"Ваша выгода","Your savings"),19,R.color.text_main,true),new LinearLayout.LayoutParams(0,-2,1f));row.addView(text("›",28,R.color.primary,true));b.addView(row);double total=ReminderScheduler.totalBenefit(this);b.addView(text(FormatUtils.money(this,total),25,total>=0?R.color.success:R.color.danger,true));b.addView(text(AppPreferences.tr(this,"Досрочные погашения и рефинансирование","Early repayments and refinancing"),13,R.color.text_secondary,false));return c;}\n    private LinearLayout.LayoutParams benefitParams(){LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,0,0,dp(16));return p;}\n\n'''
              s=s.replace(marker,helper+marker,1)
          s=s.replace('double debt=0,due=0,paidMonth=0,remainMonth=0,totalInterest=0,paidInterest=0,remainInterest=0,overdue=0,dep=0,depIncome=0,depFinal=0;','double debt=0,due=0,paidMonth=0,remainMonth=0,earlyMonth=0,totalInterest=0,paidInterest=0,remainInterest=0,overdue=0,dep=0,depIncome=0,depFinal=0;',1)
          s=s.replace('paidMonth+=ReminderScheduler.paidThisMonth(r);remainMonth+=ReminderScheduler.remainingThisMonth(r);','paidMonth+=ReminderScheduler.paidThisMonth(r);remainMonth+=ReminderScheduler.remainingThisMonth(r);earlyMonth+=ReminderScheduler.earlyRepaymentThisMonth(r);',1)
          s=s.replace('statBox(AppPreferences.tr(this,"Оплачено","Paid"),paidMonth,R.color.success)','statBox(AppPreferences.tr(this,"Оплачено по графику","Scheduled paid"),paidMonth,R.color.success)',1)
          target='stats.addView(statBox(AppPreferences.tr(this,"Осталось оплатить","Remaining"),remainMonth,remainMonth>0?R.color.warning:R.color.success),new LinearLayout.LayoutParams(0,-2,1f));'
          if target in s and 'Досрочно внесено в этом месяце' not in s:
              s=s.replace(target,target+'TextView earlyPaid=text(AppPreferences.tr(this,"Досрочно внесено в этом месяце: ","Early repayments this month: ")+FormatUtils.money(this,earlyMonth),13,R.color.primary,true);LinearLayout.LayoutParams epp=new LinearLayout.LayoutParams(-1,-2);epp.setMargins(0,dp(10),0,0);box.addView(earlyPaid,epp);',1)
          p.write_text(s,encoding='utf-8')

          # Scheduler: actual paid-this-month uses the real payment date; remaining for this month still follows due dates.
          p=root/'ReminderScheduler.java'; s=p.read_text(encoding='utf-8')
          old='''    public static double paidThisMonth(PaymentReminder r){if(r==null)return 0;Calendar n=Calendar.getInstance();double t=0;for(int i=0;i<r.months;i++){Calendar d=buildDueDate(r,i);if(d.get(Calendar.YEAR)==n.get(Calendar.YEAR)&&d.get(Calendar.MONTH)==n.get(Calendar.MONTH))t+=Math.min(paymentAmount(r,i),paidAmount(r,i));}return t;}\n    public static double remainingThisMonth(PaymentReminder r){return Math.max(0,dueThisMonth(r)-paidThisMonth(r));}'''
          new='''    public static double paidThisMonth(PaymentReminder r){if(r==null)return 0;Calendar n=Calendar.getInstance();double t=0;for(int i=0;i<r.months;i++){long at=paidAt(r,i);if(at<=0)continue;Calendar d=Calendar.getInstance();d.setTimeInMillis(at);if(d.get(Calendar.YEAR)==n.get(Calendar.YEAR)&&d.get(Calendar.MONTH)==n.get(Calendar.MONTH))t+=paidAmount(r,i);}return Math.max(0,t);}\n    public static double paidDueThisMonth(PaymentReminder r){if(r==null)return 0;Calendar n=Calendar.getInstance();double t=0;for(int i=0;i<r.months;i++){Calendar d=buildDueDate(r,i);if(d.get(Calendar.YEAR)==n.get(Calendar.YEAR)&&d.get(Calendar.MONTH)==n.get(Calendar.MONTH))t+=Math.min(paymentAmount(r,i),paidAmount(r,i));}return Math.max(0,t);}\n    public static double earlyRepaymentThisMonth(PaymentReminder r){if(r==null)return 0;Calendar n=Calendar.getInstance();double t=0;for(BenefitEvent e:benefits(r)){if(!HISTORY_EARLY.equals(e.type)||e.actionAmount<=0)continue;Calendar d=Calendar.getInstance();d.setTimeInMillis(e.time);if(d.get(Calendar.YEAR)==n.get(Calendar.YEAR)&&d.get(Calendar.MONTH)==n.get(Calendar.MONTH))t+=e.actionAmount;}return Math.max(0,t);}\n    public static double remainingThisMonth(PaymentReminder r){return Math.max(0,dueThisMonth(r)-paidDueThisMonth(r));}'''
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Payment details: distinguish payoff-now from future scheduled cost and make archived payment restoration explicit.
          p=root/'PaymentDetailsActivity.java'; s=p.read_text(encoding='utf-8')
          old='bigLabelValue(b,AppPreferences.tr(this,"Остаток долга","Remaining debt"),FormatUtils.money(this,ReminderScheduler.remainingDebt(reminder)));int next='
          new='double payoffNow=ReminderScheduler.remainingDebt(reminder);double futureInterest=ReminderScheduler.remainingInterest(reminder);bigLabelValueInfo(b,AppPreferences.tr(this,"Для полного погашения сейчас","To repay in full now"),FormatUtils.money(this,payoffNow),AppPreferences.tr(this,"Это расчётный остаток основного долга, который нужно закрыть сейчас. Точную сумму полного погашения на конкретную дату уточняйте в банке. Ниже показано, сколько ещё выйдет по графику с будущими процентами.","This is the estimated principal balance to close now. Confirm the exact payoff amount for a specific date with the bank. Below you can see the remaining scheduled total including future interest."));addSummary(b,AppPreferences.tr(this,"Если платить по графику","If paid on schedule"),FormatUtils.money(this,payoffNow+futureInterest));addSummary(b,AppPreferences.tr(this,"Будущие проценты","Future interest"),FormatUtils.money(this,futureInterest));int next='
          if old in s:s=s.replace(old,new,1)
          helper='''    private void bigLabelValueInfo(LinearLayout b,String l,String v,String help){LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.HORIZONTAL);row.setGravity(Gravity.CENTER_VERTICAL);row.addView(text(l,13,R.color.result_secondary,false),new LinearLayout.LayoutParams(0,-2,1f));TextView info=text("ⓘ",19,R.color.result_secondary,true);info.setGravity(Gravity.CENTER);info.setClickable(true);info.setOnClickListener(x->new AlertDialog.Builder(this).setTitle(l).setMessage(help).setPositiveButton(AppPreferences.tr(this,"Понятно","OK"),null).show());row.addView(info,new LinearLayout.LayoutParams(dp(38),dp(38)));b.addView(row);TextView val=text(v,28,R.color.white,true);LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,dp(3),0,dp(4));b.addView(val,p);}\n'''
          marker='    private void bigLabelValue(LinearLayout b,String l,String v)'
          if marker in s and 'private void bigLabelValueInfo' not in s:s=s.replace(marker,helper+marker,1)
          old='''MaterialButton paid=mini(ReminderScheduler.isPaid(reminder,index)?AppPreferences.tr(this,"Изменить оплату","Edit payment"):AppPreferences.tr(this,"Платёж оплачен","Payment paid"));LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(0,dp(46),1f);pp.setMargins(dp(8),0,0,0);buttons.addView(paid,pp);paid.setOnClickListener(v->markPaidDialog(index));'''
          new='''boolean archivedPaid=showArchive&&ReminderScheduler.isPaid(reminder,index);MaterialButton paid=mini(archivedPaid?AppPreferences.tr(this,"Вернуть платёж","Restore payment"):ReminderScheduler.isPaid(reminder,index)?AppPreferences.tr(this,"Изменить оплату","Edit payment"):AppPreferences.tr(this,"Платёж оплачен","Payment paid"));LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(0,dp(46),1f);pp.setMargins(dp(8),0,0,0);buttons.addView(paid,pp);paid.setOnClickListener(v->{if(archivedPaid)confirmRestorePayment(index);else markPaidDialog(index);});'''
          if old in s:s=s.replace(old,new,1)
          marker='    private void markPaidDialog(int index)'
          if marker in s and 'private void confirmRestorePayment' not in s:
              restore='''    private void confirmRestorePayment(int index){new AlertDialog.Builder(this).setTitle(AppPreferences.tr(this,"Вернуть платёж из архива?","Restore payment from archive?")).setMessage(AppPreferences.tr(this,"Отметка «Оплачен» будет снята, платёж снова станет активным и вернётся в график.","The paid mark will be removed and the installment will return to the active schedule.")).setNegativeButton(AppPreferences.tr(this,"Отмена","Cancel"),null).setPositiveButton(AppPreferences.tr(this,"Вернуть платёж","Restore payment"),(d,w)->{ReminderScheduler.unmarkPaid(this,reminder.id,index);refresh();}).show();}\n\n'''
              s=s.replace(marker,restore+marker,1)
          p.write_text(s,encoding='utf-8')

          # Early-payment comparison: only the best option is green, every alternative is clearly red.
          p=root/'EarlyPaymentAdvisorActivity.java'; s=p.read_text(encoding='utf-8')
          pattern=r'    private View optionCard\(Option o,boolean best,double requested\)\{.*?\n\n    private LinearLayout labelRow'
          replacement='''    private View optionCard(Option o,boolean best,double requested){MaterialCardView c=card();c.setStrokeWidth(dp(2));c.setStrokeColor(ContextCompat.getColor(this,best?R.color.success:R.color.danger));LinearLayout b=box(c);int accent=best?R.color.success:R.color.danger;if(best)b.addView(text(AppPreferences.tr(this,"★ Самый выгодный вариант","★ Best estimated option"),14,R.color.success,true));else b.addView(text(AppPreferences.tr(this,"Менее выгодный вариант","Less beneficial option"),14,R.color.danger,true));b.addView(text(o.reminder.title,20,R.color.text_main,true));b.addView(text(FormatUtils.typeLabel(this,o.reminder.type)+" · "+rate(o.reminder.annualRate)+"%",13,R.color.text_secondary,false));LinearLayout.LayoutParams gap=new LinearLayout.LayoutParams(-1,-2);gap.setMargins(0,dp(10),0,0);TextView save=text(AppPreferences.tr(this,"Экономия на процентах: ","Estimated interest saving: ")+FormatUtils.money(this,o.savings),18,accent,true);b.addView(save,gap);b.addView(text(AppPreferences.tr(this,"Внести досрочно: ","Extra payment: ")+FormatUtils.money(this,o.amount),14,R.color.text_main,false));if(o.amount+0.01<requested)b.addView(text(AppPreferences.tr(this,"Остаток этого кредита меньше введённой суммы, поэтому для расчёта использован только его остаток.","This loan balance is below the entered amount, so only its remaining balance is used."),12,R.color.warning,false));b.addView(text(o.reduceTerm?AppPreferences.tr(this,"Рекомендация: сократить срок","Recommendation: reduce the term"):AppPreferences.tr(this,"Рекомендация: уменьшить платёж","Recommendation: reduce the monthly payment"),15,best?R.color.primary:R.color.danger,true));double newPayment=o.reduceTerm?o.sim.keptPayment:o.sim.reducedPayment;int newMonths=o.reduceTerm?o.sim.reducedMonths:o.sim.remainingMonths;b.addView(text(AppPreferences.tr(this,"Новый платёж: ","New payment: ")+FormatUtils.money(this,newPayment),13,R.color.text_secondary,false));b.addView(text(AppPreferences.tr(this,"Новый срок: ","New term: ")+newMonths+AppPreferences.tr(this," мес."," mo."),13,R.color.text_secondary,false));MaterialButton open=new MaterialButton(this);open.setText(AppPreferences.tr(this,"Открыть кредит","Open loan"));open.setAllCaps(false);open.setTextColor(ContextCompat.getColor(this,best?R.color.primary:R.color.danger));open.setBackgroundTintList(ColorStateList.valueOf(ContextCompat.getColor(this,R.color.card_background)));open.setStrokeColor(ColorStateList.valueOf(ContextCompat.getColor(this,best?R.color.primary:R.color.danger)));open.setStrokeWidth(dp(1));open.setCornerRadius(dp(12));open.setOnClickListener(v->{Intent in=new Intent(this,PaymentDetailsActivity.class);in.putExtra(PaymentDetailsActivity.EXTRA_REMINDER_ID,o.reminder.id);startActivity(in);});LinearLayout.LayoutParams op=new LinearLayout.LayoutParams(-1,dp(48));op.setMargins(0,dp(12),0,0);b.addView(open,op);return c;}\n\n    private LinearLayout labelRow'''
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n==1:s=ns
          p.write_text(s,encoding='utf-8')

          # Persistent day notification and the sound reminder are two separate notifications.
          p=root/'PaymentNotificationHelper.java'; s=p.read_text(encoding='utf-8')
          marker='''    public static void cancel(Context context,long reminderId,int index){'''
          if 'alarmNotificationId' not in s:
              helper='''    public static int alarmNotificationId(long reminderId,int index){int n=notificationId(reminderId,index)^0x2A6F3B19;return n==Integer.MIN_VALUE?1:Math.abs(n);}\n\n'''
              s=s.replace(marker,helper+marker,1)
          s=s.replace('NotificationManagerCompat.from(context).cancel(notificationId(reminderId,index));\n        cancelEndOfDay','NotificationManagerCompat.from(context).cancel(notificationId(reminderId,index));\n        NotificationManagerCompat.from(context).cancel(alarmNotificationId(reminderId,index));\n        cancelEndOfDay',1)
          p.write_text(s,encoding='utf-8')

          p=root/'ReminderReceiver.java'; s=p.read_text(encoding='utf-8')
          s=s.replace('int notificationId = PaymentNotificationHelper.notificationId(id,index);','int dayNotificationId=PaymentNotificationHelper.notificationId(id,index);\n        int alarmNotificationId=PaymentNotificationHelper.alarmNotificationId(id,index);\n        int notificationId=(soundAlarm||snoozed)?alarmNotificationId:dayNotificationId;',1)
          s=s.replace('snooze.putExtra("reminder_id", id); snooze.putExtra("payment_index", index); snooze.putExtra("notification_id", notificationId);','snooze.putExtra("reminder_id", id); snooze.putExtra("payment_index", index); snooze.putExtra("notification_id", silentDay?alarmNotificationId:notificationId);',1)
          s=s.replace('''        NotificationCompat.Builder b = new NotificationCompat.Builder(context, channel)''','''        boolean persistentDay=silentDay;\n        NotificationCompat.Builder b = new NotificationCompat.Builder(context, channel)''',1)
          s=s.replace('.setAutoCancel(!(today || overdue))\n                .setOngoing(today || overdue)','.setAutoCancel(!persistentDay)\n                .setOngoing(persistentDay)',1)
          p.write_text(s,encoding='utf-8')

          p=root/'PaymentActionReceiver.java'; s=p.read_text(encoding='utf-8')
          old='''        if(action.startsWith(ACTION_CLEAR_TODAY_NOTIFICATION)){\n            if(notificationId>=0)NotificationManagerCompat.from(context).cancel(notificationId);\n            return;\n        }'''
          new='''        if(action.startsWith(ACTION_CLEAR_TODAY_NOTIFICATION)){\n            // Payment-day notices are intentionally persistent and are cleared only after the payment is marked paid.\n            return;\n        }'''
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Keyboard avoidance: account for the IME padding when deciding what is visible.
          p=root/'UiUtils.java'; s=p.read_text(encoding='utf-8')
          s=s.replace('int viewportBottom=scroll.getScrollY()+scroll.getHeight()-margin;','int viewportBottom=Math.max(viewportTop+Math.max(field.getHeight(),dp(scroll.getContext(),56)),scroll.getScrollY()+scroll.getHeight()-scroll.getPaddingBottom()-margin);',1)
          old='''        View focused=scroll.findFocus();\n        if(focused!=null)recheckField(scroll,focused);'''
          new='''        View focused=scroll.findFocus();\n        if(focused!=null)recheckField(scroll,focused);\n        else scroll.postDelayed(()->{View f=scroll.findFocus();if(f!=null)recheckField(scroll,f);},120);'''
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Benefit history uses explicit labels so early repayment is not confused with a monthly installment.
          p=root/'BenefitHistoryActivity.java'; s=p.read_text(encoding='utf-8')
          s=s.replace('AppPreferences.tr(this,"Платёж: ","Payment: ")','AppPreferences.tr(this,"Ежемесячный платёж: ","Monthly payment: ")')
          p.write_text(s,encoding='utf-8')

          # Lock screen also participates in global keyboard resize behaviour.
          p=Path('app/src/main/AndroidManifest.xml'); s=p.read_text(encoding='utf-8')
          s=s.replace('<activity android:name=".LockActivity" android:exported="false" />','<activity android:name=".LockActivity" android:exported="false" android:windowSoftInputMode="adjustResize" />')
          p.write_text(s,encoding='utf-8')

          # Update the built-in guide to match the UI and notification behaviour.
          p=root/'InstructionActivity.java'; s=p.read_text(encoding='utf-8')
          s=s.replace('После полного сброса выбор языка появится снова.','После полного сброса выбор языка появится снова. При обычном входе после проверки защиты приложение открывает раздел «Мои платежи»; к калькуляторам можно вернуться кнопкой назад или через меню.')
          s=s.replace('It stays until you mark the payment paid or choose Remind later. If no decision was made by the selected time, a separate sound reminder is triggered.','It stays until you mark the payment paid. Remind later schedules another reminder but does not remove the silent day notice. If the payment is still unresolved at the selected time, a separate sound reminder is triggered.')
          s=s.replace('Оно остаётся, пока вы не отметите платёж оплаченным или не выберете «Напомнить позже». Если к выбранному времени решение ещё не принято, приложение запускает отдельное звуковое напоминание.','Оно не звенит, не заменяется звуковым уведомлением и остаётся в шторке, пока вы не отметите платёж оплаченным. «Напомнить позже» переносит звуковое напоминание, но не убирает постоянное беззвучное уведомление. Если к выбранному времени платёж ещё не отмечен, приложение запускает отдельное звуковое напоминание.')
          s=s.replace('Yalnızca ödeme gününde ✓ Zaten ödendi seçeneği olan kalıcı bildirim görünür; ödeme işaretlenince kaybolur ve gün bitince temizlenir. Daha sonra hatırlat seçeneği kullanılabilir.','Ödeme gününde 00:00’dan itibaren sessiz ve kalıcı bir bildirim görünür. Bu bildirim yalnızca ödeme ödendi olarak işaretlenince kaldırılır. Seçilen saatte ödeme hâlâ açık ise ayrı bir sesli hatırlatma çalışır.')
          s=s.replace('Solo el día exacto del pago aparece una notificación persistente con ✓ Ya pagado; desaparece al marcar el pago y se limpia al terminar ese día. Recordar más tarde sigue disponible.','El día del pago aparece desde las 00:00 una notificación silenciosa y persistente. Solo desaparece al marcar el pago como pagado. Si a la hora elegida sigue pendiente, se lanza un recordatorio sonoro independiente.')
          s=s.replace('В «Мои платежи» показаны общий остаток долга, сумма к оплате в этом месяце, оплачено, осталось и просрочка.','В «Мои платежи» показаны общий остаток долга, сумма к оплате в этом месяце, оплаченные по графику платежи, остаток и просрочка. Досрочные погашения показываются отдельной строкой и не смешиваются с обычными ежемесячными платежами. Здесь же находится карточка «Ваша выгода» с общей экономией от досрочных погашений и рефинансирований.')
          s=s.replace('My payments shows total debt, this month due/paid/remaining and overdue amounts.','My payments shows total debt, this month scheduled paid/remaining and overdue amounts. Early repayments are shown separately from normal monthly installments. The Your savings card is also located here and opens the history of savings from early repayment and refinancing.')
          s=s.replace('Нажмите на строку платежа, чтобы увидеть основной долг, проценты и остаток после платежа.','Нажмите на строку платежа, чтобы увидеть основной долг, проценты и остаток после платежа. Если платёж был случайно отмечен оплаченным, откройте «Архив» графика, раскройте этот платёж и нажмите «Вернуть платёж».')
          s=s.replace('Tap a payment row to see principal, interest and balance after payment.','Tap a payment row to see principal, interest and balance after payment. If an installment was marked paid by mistake, open the schedule Archive, expand that installment and tap Restore payment.')
          p.write_text(s,encoding='utf-8')

          # Version bump.
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          s=s.replace('versionCode 12','versionCode 13').replace('versionName "1.12"','versionName "1.13"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Implement payment dashboard and notification fixes v1.13"
          git push
