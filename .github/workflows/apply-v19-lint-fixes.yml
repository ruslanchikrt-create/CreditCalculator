name: Apply v1.9 lint fixes

on:
  push:
    branches:
      - v1.9-work
    paths:
      - .github/v19-lint-fix-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.9-work
      - name: Fix intentional back handling lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['MainActivity.java','LockActivity.java']:
              p=Path('app/src/main/java/com/example/creditcalculator')/name
              s=p.read_text()
              target='@Override public void onBackPressed()'
              repl='@android.annotation.SuppressLint("MissingSuperCall")\n    @Override public void onBackPressed()'
              if target not in s:
                  raise SystemExit(f'target not found in {name}')
              p.write_text(s.replace(target,repl,1))
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator
          git diff --cached --quiet && exit 0
          git commit -m "fix: document intentional back handling"
          git push origin HEAD:v1.9-work
