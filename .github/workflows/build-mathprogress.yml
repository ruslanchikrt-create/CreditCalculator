      - name: Persist v0.4.0 source
        run: |
          if ! git diff --quiet -- MathProgress; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add MathProgress
            git commit -m "Apply MathProgress v0.4.0 UI and learning update"
            git push origin HEAD:mathprogress-app || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MathProgress
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp MathProgress/app/build/outputs/apk/debug/app-debug.apk MathProgress-v0.4.0.apk

      - name: Upload MathProgress APK
        uses: actions/upload-artifact@v4
        with:
          name: MathProgress-v0.4.0-APK
          path: MathProgress-v0.4.0.apk
          if-no-files-found: error
