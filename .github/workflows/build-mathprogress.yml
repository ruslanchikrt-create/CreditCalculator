name: Build MathProgress APK

on:
  push:
    branches:
      - mathprogress-app
    paths:
      - 'MathProgress/**'
      - '.github/workflows/build-mathprogress.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize MathProgress v0.3.2 safe startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('MathProgress/app/src/main/java/com/mathprogress/app/MainActivity.kt')
          text = main.read_text()

          # Replace the entire lifecycle startup with a deliberately minimal,
          # synchronous path. No notification permission, scheduler or system
          # UI tricks are allowed to run before the first screen is visible.
          text = re.sub(
              r'''    override fun onCreate\(savedInstanceState: Bundle\?\) \{.*?\n    override fun onResume\(\) \{''',
              '''    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        try {\n            store = LocalStore(this)\n            buildShell()\n            showResults()\n            store.setLastOpenNow()\n            if (store.securityEnabled()) {\n                root.post { runCatching { lockNow() } }\n            }\n        } catch (error: Throwable) {\n            showEmergencyStartup(error)\n        }\n    }\n\n    override fun onResume() {''',
              text,
              count=1,
              flags=re.S
          )

          text = re.sub(
              r'''    override fun onResume\(\) \{.*?\n    override fun onPause\(\) \{''',
              '''    override fun onResume() {\n        super.onResume()\n        if (!::store.isInitialized) return\n        store.setLastOpenNow()\n        if (firstResume) { firstResume = false; return }\n        runCatching {\n            if (store.securityEnabled() && lockOverlay == null) {\n                val elapsed = System.currentTimeMillis() - store.backgroundAt()\n                val timeout = store.settings.autoLockSeconds * 1000L\n                if (store.backgroundAt() > 0 && (timeout == 0L || elapsed >= timeout)) lockNow()\n            }\n        }\n    }\n\n    override fun onPause() {''',
              text,
              count=1,
              flags=re.S
          )

          text = re.sub(
              r'''    override fun onPause\(\) \{.*?\n    private fun buildShell\(\) \{''',
              '''    override fun onPause() {\n        if (::store.isInitialized) {\n            store.setBackgroundAt(System.currentTimeMillis())\n        }\n        super.onPause()\n    }\n\n    private fun buildShell() {''',
              text,
              count=1,
              flags=re.S
          )

          # Remove custom inset/status-bar startup handling. Android's default
          # decor fitting is more robust across OEM skins for this test build.
          text = text.replace('        applySystemBars()\n', '')
          text = re.sub(
              r'''        root\.setOnApplyWindowInsetsListener \{ _, insets ->.*?        \}\n\n        val top =''',
              '        val top =',
              text,
              count=1,
              flags=re.S
          )
          text = text.replace('        root.requestApplyInsets()\n', '')

          marker = '    private fun buildShell() {'
          emergency = '''    private fun showEmergencyStartup(error: Throwable) {\n        android.util.Log.e("MathProgress", "Fatal startup error", error)\n        val scroll = android.widget.ScrollView(this)\n        val box = LinearLayout(this).apply {\n            orientation = LinearLayout.VERTICAL\n            setPadding(36, 72, 36, 36)\n            setBackgroundColor(Color.rgb(24, 25, 29))\n        }\n        val title = TextView(this).apply {\n            text = "Не удалось открыть приложение"\n            textSize = 24f\n            setTextColor(Color.WHITE)\n            typeface = Typeface.DEFAULT_BOLD\n        }\n        val info = TextView(this).apply {\n            text = "Теперь приложение не закрывается автоматически. Ниже указана точная причина ошибки — сделайте скриншот этого экрана и пришлите его."\n            textSize = 15f\n            setTextColor(Color.rgb(205, 207, 215))\n            setPadding(0, 20, 0, 24)\n        }\n        val detail = TextView(this).apply {\n            text = error.javaClass.name + "\\n\\n" + (error.message ?: "Без сообщения")\n            textSize = 14f\n            setTextColor(Color.rgb(255, 190, 90))\n            setTextIsSelectable(true)\n            setPadding(20, 20, 20, 20)\n            setBackgroundColor(Color.rgb(39, 40, 46))\n        }\n        val retry = Button(this).apply {\n            text = "Повторить запуск"\n            isAllCaps = false\n            textSize = 16f\n            setOnClickListener { recreate() }\n        }\n        box.addView(title)\n        box.addView(info)\n        box.addView(detail, LinearLayout.LayoutParams(-1, -2))\n        box.addView(retry, LinearLayout.LayoutParams(-1, 60).apply { setMargins(0, 28, 0, 0) })\n        scroll.addView(box, android.widget.FrameLayout.LayoutParams(-1, -2))\n        setContentView(scroll)\n    }\n\n'''
          if 'private fun showEmergencyStartup' not in text:
              text = text.replace(marker, emergency + marker, 1)

          main.write_text(text)

          gradle = Path('MathProgress/app/build.gradle.kts')
          g = gradle.read_text()
          g = re.sub(r'versionCode = \d+', 'versionCode = 5', g)
          g = re.sub(r'versionName = "[^"]+"', 'versionName = "0.3.2"', g)
          gradle.write_text(g)
          PY

      - name: Persist normalized source
        run: |
          if ! git diff --quiet -- MathProgress; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add MathProgress
            git commit -m "Add MathProgress v0.3.2 safe startup"
            git push origin HEAD:mathprogress-app || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MathProgress
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp MathProgress/app/build/outputs/apk/debug/app-debug.apk MathProgress-v0.3.2.apk

      - name: Upload MathProgress APK
        uses: actions/upload-artifact@v4
        with:
          name: MathProgress-v0.3.2-APK
          path: MathProgress-v0.3.2.apk
          if-no-files-found: error
