name: Build MathProgress APK

on:
  push:
    branches:
      - mathprogress-app
    paths:
      - 'MathProgress/**'
      - '.github/workflows/build-mathprogress.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize MathProgress v0.3 source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('MathProgress/app/src/main/java/com/mathprogress/app/MainActivity.kt')
          text = main.read_text()
          text = text.replace(
              'android.widget.ScrollView.LayoutParams(-1,-2)',
              'android.widget.FrameLayout.LayoutParams(-1,-2)'
          )
          main.write_text(text)

          store = Path('MathProgress/app/src/main/java/com/mathprogress/app/LocalStore.kt')
          text = store.read_text()
          text = text.replace(
              'val migratedMethod = if (oldPasswordHash.isNotBlank() && s.optString("securityMethod").isBlank()) "pin" else s.optString("securityMethod", "none")',
              'val migratedMethod = s.optString("securityMethod", "none")'
          )
          text = text.replace(
              'pinHash = s.optString("pinHash", oldPasswordHash),',
              'pinHash = s.optString("pinHash", ""),'
          )
          store.write_text(text)

          gradle = Path('MathProgress/app/build.gradle.kts')
          text = gradle.read_text().replace('versionCode = 1', 'versionCode = 3').replace('versionName = "0.1.0"', 'versionName = "0.3.0"')
          gradle.write_text(text)

          journey = Path('MathProgress/app/src/main/java/com/mathprogress/app/DailyJourneyView.kt')
          text = journey.read_text()
          old = '''        linePaint.color = if (darkMode) Color.rgb(67, 69, 79) else Color.rgb(218, 220, 229)\n        for (i in 0 until centersList.lastIndex) {\n            val (x1,y1)=centersList[i]; val (x2,y2)=centersList[i+1]\n            canvas.drawLine(x1,y1,x2,y2,linePaint)\n        }'''
          new = '''        for (i in 0 until centersList.lastIndex) {\n            val day1 = i + 1\n            val day2 = i + 2\n            linePaint.color = when {\n                statuses[day1] == 2 && statuses[day2] == 2 -> Color.rgb(38, 174, 99)\n                statuses[day1] == 2 -> Color.rgb(99, 91, 255)\n                statuses[day1] == 1 -> Color.rgb(242, 158, 45)\n                else -> if (darkMode) Color.rgb(67, 69, 79) else Color.rgb(218, 220, 229)\n            }\n            val (x1,y1)=centersList[i]; val (x2,y2)=centersList[i+1]\n            canvas.drawLine(x1,y1,x2,y2,linePaint)\n        }'''
          if old in text:
              text = text.replace(old, new)
          journey.write_text(text)
          PY

      - name: Persist normalized source
        run: |
          if ! git diff --quiet -- MathProgress; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add MathProgress
            git commit -m "Fix MathProgress v0.3 source"
            git push origin HEAD:mathprogress-app || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MathProgress
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp MathProgress/app/build/outputs/apk/debug/app-debug.apk MathProgress.apk

      - name: Upload MathProgress APK
        uses: actions/upload-artifact@v4
        with:
          name: MathProgress-APK
          path: MathProgress.apk
          if-no-files-found: error
