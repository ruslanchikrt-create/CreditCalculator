name: Build MathProgress APK

on:
  push:
    branches:
      - mathprogress-app
    paths:
      - 'MathProgress/**'
      - '.github/workflows/build-mathprogress.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply v0.3.3 results polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          main = Path('MathProgress/app/src/main/java/com/mathprogress/app/MainActivity.kt')
          text = main.read_text()
          text = text.replace('val vertical = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bg()) }','val vertical = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(bg()); setPadding(0, dp(12), 0, 0) }')
          text = text.replace('top.addView(text("Математика — Прогресс", 19f, true)','top.addView(text("Математика — Прогресс", 17.5f, true)')
          text = text.replace('vertical.addView(top, LinearLayout.LayoutParams(-1, dp(60)))','vertical.addView(top, LinearLayout.LayoutParams(-1, dp(56)))')
          payload=''
          new_results=base64.b64decode(payload).decode()
          text=re.sub(r'    private fun showResults\(\)\{.*?\n    // ---------- SOLVER ----------',new_results+'\n    // ---------- SOLVER ----------',text,count=1,flags=re.S)
          text=re.sub(r'Версия 0\.3(?:\.\d+)?','Версия 0.3.3',text)
          main.write_text(text)
          gradle=Path('MathProgress/app/build.gradle.kts')
          g=gradle.read_text()
          g=re.sub(r'versionCode = \d+','versionCode = 6',g)
          g=re.sub(r'versionName = "[^"]+"','versionName = "0.3.3"',g)
          gradle.write_text(g)
          PY

      - name: Persist source polish
        run: |
          if ! git diff --quiet -- MathProgress; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add MathProgress
            git commit -m "Apply MathProgress v0.3.3 results polish"
            git push origin HEAD:mathprogress-app || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MathProgress
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp MathProgress/app/build/outputs/apk/debug/app-debug.apk MathProgress-v0.3.3.apk

      - name: Upload MathProgress APK
        uses: actions/upload-artifact@v4
        with:
          name: MathProgress-v0.3.3-APK
          path: MathProgress-v0.3.3.apk
          if-no-files-found: error
