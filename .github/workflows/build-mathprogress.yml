name: Build MathProgress APK

on:
  push:
    branches:
      - mathprogress-app
    paths:
      - 'MathProgress/**'
      - '.github/workflows/build-mathprogress.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize MathProgress v0.3.1 source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('MathProgress/app/src/main/java/com/mathprogress/app/MainActivity.kt')
          text = main.read_text()

          old_create = '''        NotificationScheduler.ensureChannels(this)\n        requestNotificationPermission()\n        buildShell()\n        showResults()\n        NotificationScheduler.scheduleAll(this, store)\n        store.setLastOpenNow()\n        if (store.securityEnabled()) lockNow()'''
          new_create = '''        runCatching { NotificationScheduler.ensureChannels(this) }\n        buildShell()\n        try {\n            showResults()\n        } catch (e: Throwable) {\n            showStartupFallback(e)\n        }\n        store.setLastOpenNow()\n        if (store.securityEnabled()) runCatching { lockNow() }\n        root.postDelayed({\n            runCatching { requestNotificationPermission() }\n            runCatching { NotificationScheduler.scheduleAll(this, store) }\n        }, 1200L)'''
          if old_create in text:
              text = text.replace(old_create, new_create)

          text = text.replace(
              'NotificationScheduler.scheduleInactive(this, store)',
              'runCatching { NotificationScheduler.scheduleInactive(this, store) }'
          )
          text = text.replace(
              'NotificationScheduler.scheduleUnfinished(this, store)',
              'runCatching { NotificationScheduler.scheduleUnfinished(this, store) }'
          )

          marker = '    // ---------- HELPERS ----------\n'
          fallback = '''    private fun showStartupFallback(error: Throwable) {\n        val box = LinearLayout(this).apply {\n            orientation = LinearLayout.VERTICAL\n            gravity = Gravity.CENTER_HORIZONTAL\n            setPadding(dp(24), dp(48), dp(24), dp(24))\n        }\n        box.addView(iconImage(R.drawable.ic_info, 54, amber))\n        box.addView(text("Не удалось открыть главный экран", 22f, true).apply {\n            gravity = Gravity.CENTER\n            setPadding(0, dp(16), 0, dp(8))\n        })\n        box.addView(text("Данные не удалены. Можно открыть решатель и продолжить работу.", 14f, false, muted()).apply { gravity = Gravity.CENTER })\n        box.addView(space(16))\n        box.addView(primary("Открыть решатель", R.drawable.ic_calculate) { showSolve() })\n        box.addView(space(8))\n        box.addView(outline("Повторить загрузку", R.drawable.ic_home) { showResults() })\n        content.removeAllViews()\n        content.addView(android.widget.ScrollView(this).apply { addView(box) }, FrameLayout.LayoutParams(-1, -1))\n        android.util.Log.e("MathProgress", "Startup screen error", error)\n    }\n\n'''
          if fallback not in text and marker in text:
              text = text.replace(marker, fallback + marker)

          main.write_text(text)

          gradle = Path('MathProgress/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 3', 'versionCode = 4')
          g = g.replace('versionName = "0.3.0"', 'versionName = "0.3.1"')
          gradle.write_text(g)
          PY

      - name: Persist normalized source
        run: |
          if ! git diff --quiet -- MathProgress; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add MathProgress
            git commit -m "Fix MathProgress startup crash"
            git push origin HEAD:mathprogress-app || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MathProgress
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp MathProgress/app/build/outputs/apk/debug/app-debug.apk MathProgress-v0.3.1.apk

      - name: Upload MathProgress APK
        uses: actions/upload-artifact@v4
        with:
          name: MathProgress-v0.3.1-APK
          path: MathProgress-v0.3.1.apk
          if-no-files-found: error
