name: Apply v1.8 final patches

on:
  push:
    paths:
      - '.github/workflows/apply-v18-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.8 patches
        run: python3 scripts/apply_v18.py
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator/AddReminderActivity.java app/src/main/java/com/example/creditcalculator/MainActivity.java
          git commit -m "Finish v1.8 editing past dates and about screen"
          git push
