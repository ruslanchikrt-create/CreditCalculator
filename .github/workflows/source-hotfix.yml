name: Apply source hotfixes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply targeted source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep the reminder alarm hotfix idempotent.
          scheduler = Path('app/src/main/java/com/example/creditcalculator/ReminderScheduler.java')
          text = scheduler.read_text(encoding='utf-8')
          text = text.replace('catch(SecurityException|RuntimeException ignored)', 'catch(RuntimeException ignored)')
          scheduler.write_text(text, encoding='utf-8')

          receiver = Path('app/src/main/java/com/example/creditcalculator/ReminderReceiver.java')
          text = receiver.read_text(encoding='utf-8')
          old = 'NotificationManagerCompat.from(context).notify(notificationId, b.build());\n    }'
          new = 'NotificationManagerCompat.from(context).notify(notificationId, b.build());\n        ReminderScheduler.scheduleFollowing(context, r, index);\n    }'
          if old in text and 'ReminderScheduler.scheduleFollowing(context, r, index);' not in text:
              text = text.replace(old, new)
          receiver.write_text(text, encoding='utf-8')

          # Reminder form: contextual help + reliable notification permission flow.
          add = Path('app/src/main/java/com/example/creditcalculator/AddReminderActivity.java')
          text = add.read_text(encoding='utf-8')
          if 'import android.content.Intent;' not in text:
              text = text.replace('import android.content.Context;\n', 'import android.content.Context;\nimport android.content.Intent;\n')
          if 'import android.provider.Settings;' not in text:
              text = text.replace('import android.os.Bundle;\n', 'import android.os.Bundle;\nimport android.provider.Settings;\n')
          text = text.replace(
              'private boolean updatingPayment, updatingTitle, titleEditedByUser, saving;',
              'private boolean updatingPayment, updatingTitle, titleEditedByUser, saving, waitingNotificationPermission, waitingNotificationSettings;'
          )

          replacements = [
              ('principalLayout=addLayout(content,AppPreferences.tr(this,"Сумма кредита, ₽","Loan amount, ₽")); principalInput=',
               'principalLayout=addLayout(content,AppPreferences.tr(this,"Сумма кредита, ₽","Loan amount, ₽")); attachInfo(principalLayout,AppPreferences.tr(this,"Основная сумма","Main amount"),AppPreferences.tr(this,"Укажите полную сумму кредита или стоимость покупки до вычета первоначального взноса. Для вклада укажите сумму вклада.","Enter the full loan/purchase amount before subtracting the down payment. For a deposit, enter the deposit amount.")); principalInput='),
              ('downPaymentLayout=addLayout(content,AppPreferences.tr(this,"Первоначальный взнос, ₽","Down payment, ₽")); downPaymentInput=',
               'downPaymentLayout=addLayout(content,AppPreferences.tr(this,"Первоначальный взнос, ₽","Down payment, ₽")); attachInfo(downPaymentLayout,AppPreferences.tr(this,"Первоначальный взнос","Down payment"),AppPreferences.tr(this,"Сумма, которую вы вносите сразу. Она должна быть меньше основной суммы.","The amount you pay upfront. It must be less than the main amount.")); downPaymentInput='),
              ('insuranceLayout=addLayout(content,AppPreferences.tr(this,"Страховка, ₽","Insurance, ₽")); insuranceInput=',
               'insuranceLayout=addLayout(content,AppPreferences.tr(this,"Страховка, ₽","Insurance, ₽")); attachInfo(insuranceLayout,AppPreferences.tr(this,"Страховка","Insurance"),AppPreferences.tr(this,"Введите стоимость страховки. Переключатель ниже определяет, включать ли страховку в финансируемую сумму.","Enter the insurance cost. The switch below controls whether insurance is included in the financed amount.")); insuranceInput='),
              ('rateLayout=addLayout(content,AppPreferences.tr(this,"Процентная ставка, % годовых","Interest rate, % per year")); rateInput=',
               'rateLayout=addLayout(content,AppPreferences.tr(this,"Процентная ставка, % годовых","Interest rate, % per year")); attachInfo(rateLayout,AppPreferences.tr(this,"Процентная ставка","Interest rate"),AppPreferences.tr(this,"Укажите годовую процентную ставку по договору.","Enter the annual interest rate from the agreement.")); rateInput='),
              ('addTermRow(content);\n        addLabel',
               'addTermRow(content); attachInfo(termLayout,AppPreferences.tr(this,"Срок","Term"),AppPreferences.tr(this,"Укажите срок и выберите справа месяцы или годы.","Enter the term and choose months or years on the right."));\n        addLabel'),
              ('paymentLayout=addLayout(content,AppPreferences.tr(this,"Ежемесячный платёж, ₽ (можно изменить)","Monthly payment, ₽ (editable)")); paymentInput=',
               'paymentLayout=addLayout(content,AppPreferences.tr(this,"Ежемесячный платёж, ₽ (можно изменить)","Monthly payment, ₽ (editable)")); attachInfo(paymentLayout,AppPreferences.tr(this,"Ежемесячный платёж","Monthly payment"),AppPreferences.tr(this,"Приложение рассчитывает платёж автоматически. Если банк указал другую фактическую сумму, её можно ввести вручную.","The app calculates this automatically. If the bank gives a different actual amount, you can enter it manually.")); paymentInput='),
              ('dateLayout=addLayout(content,AppPreferences.tr(this,"Дата первого платежа","First payment date")); dateInput=',
               'dateLayout=addLayout(content,AppPreferences.tr(this,"Дата первого платежа","First payment date")); attachInfo(dateLayout,AppPreferences.tr(this,"Дата первого платежа","First payment date"),AppPreferences.tr(this,"Выберите дату первого платежа. От неё строится график следующих платежей.","Choose the first payment date. The following payment schedule is built from it.")); dateInput='),
              ('timeLayout=addLayout(content,AppPreferences.tr(this,"Время напоминания","Reminder time")); timeInput=',
               'timeLayout=addLayout(content,AppPreferences.tr(this,"Время напоминания","Reminder time")); attachInfo(timeLayout,AppPreferences.tr(this,"Время напоминания","Reminder time"),AppPreferences.tr(this,"В это время приложение показывает уведомление. Если платёж сегодня, а выбранное время уже прошло, уведомление появится сразу после сохранения.","The app shows the notification at this time. If the payment is today and the selected time has already passed, the notification appears immediately after saving.")); timeInput=')
          ]
          for old, new in replacements:
              if old in text and new not in text:
                  text = text.replace(old, new)

          text = text.replace(
              'saveButton.setText(AppPreferences.tr(this,"Сохранить","Save"));requestNotificationPermissionIfNeeded();if(editReminder==null&&past)showPastDialog(r.id);else finishSaved();',
              'saveButton.setText(AppPreferences.tr(this,"Сохранить","Save"));if(editReminder==null&&past)showPastDialog(r.id);else finishSaved();'
          )

          old_block = '''    private void finishSaved(){requestNotificationPermissionIfNeeded();Toast.makeText(this,editReminder==null?AppPreferences.tr(this,"Запись сохранена","Saved"):AppPreferences.tr(this,"Изменения сохранены","Changes saved"),Toast.LENGTH_LONG).show();setResult(RESULT_OK);finish();}\n    private void requestNotificationPermissionIfNeeded(){if(Build.VERSION.SDK_INT>=33&&ContextCompat.checkSelfPermission(this,Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED)ActivityCompat.requestPermissions(this,new String[]{Manifest.permission.POST_NOTIFICATIONS},NOTIFICATION_PERMISSION_REQUEST);}\n'''
          new_block = '''    private void finishSaved(){\n        if(Build.VERSION.SDK_INT>=33&&ContextCompat.checkSelfPermission(this,Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED){\n            waitingNotificationPermission=true;\n            ActivityCompat.requestPermissions(this,new String[]{Manifest.permission.POST_NOTIFICATIONS},NOTIFICATION_PERMISSION_REQUEST);\n            return;\n        }\n        completeSaved();\n    }\n\n    private void completeSaved(){\n        waitingNotificationPermission=false;waitingNotificationSettings=false;\n        Toast.makeText(this,editReminder==null?AppPreferences.tr(this,"Запись сохранена","Saved"):AppPreferences.tr(this,"Изменения сохранены","Changes saved"),Toast.LENGTH_LONG).show();\n        setResult(RESULT_OK);finish();\n    }\n\n    private void rescheduleAfterPermission(){\n        new Thread(()->{ReminderScheduler.rescheduleAll(getApplicationContext());runOnUiThread(()->{if(!isFinishing()&&!isDestroyed())completeSaved();});},"notification-reschedule").start();\n    }\n\n    @Override public void onRequestPermissionsResult(int requestCode,String[] permissions,int[] grantResults){\n        super.onRequestPermissionsResult(requestCode,permissions,grantResults);\n        if(requestCode!=NOTIFICATION_PERMISSION_REQUEST)return;\n        waitingNotificationPermission=false;\n        if(grantResults.length>0&&grantResults[0]==PackageManager.PERMISSION_GRANTED){rescheduleAfterPermission();return;}\n        new AlertDialog.Builder(this)\n                .setTitle(AppPreferences.tr(this,"Уведомления выключены","Notifications are disabled"))\n                .setMessage(AppPreferences.tr(this,"Чтобы напоминания о платежах появлялись в шторке, разрешите уведомления для приложения в настройках Android.","Allow notifications for the app in Android settings so payment reminders can appear in the notification shade."))\n                .setNegativeButton(AppPreferences.tr(this,"Продолжить без уведомлений","Continue without notifications"),(d,w)->completeSaved())\n                .setPositiveButton(AppPreferences.tr(this,"Открыть настройки","Open settings"),(d,w)->openNotificationSettings())\n                .setCancelable(false).show();\n    }\n\n    private void openNotificationSettings(){\n        waitingNotificationSettings=true;\n        try{Intent i=new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);i.putExtra(Settings.EXTRA_APP_PACKAGE,getPackageName());startActivity(i);}\n        catch(Exception e){Intent i=new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,android.net.Uri.parse("package:"+getPackageName()));startActivity(i);}\n    }\n\n    @Override protected void onResume(){\n        super.onResume();\n        if(waitingNotificationSettings&&Build.VERSION.SDK_INT>=33&&ContextCompat.checkSelfPermission(this,Manifest.permission.POST_NOTIFICATIONS)==PackageManager.PERMISSION_GRANTED){\n            waitingNotificationSettings=false;rescheduleAfterPermission();\n        }\n    }\n'''
          if old_block in text:
              text = text.replace(old_block, new_block)

          marker = '    private TextInputEditText addField(LinearLayout p,String h,int it)'
          helper = '''    private void attachInfo(TextInputLayout layout,String title,String message){\n        if(layout==null)return;\n        layout.setEndIconMode(TextInputLayout.END_ICON_CUSTOM);\n        layout.setEndIconDrawable(android.R.drawable.ic_dialog_info);\n        layout.setEndIconTintList(ColorStateList.valueOf(ContextCompat.getColor(this,R.color.primary)));\n        layout.setEndIconContentDescription(AppPreferences.tr(this,"Подсказка","Help"));\n        layout.setEndIconOnClickListener(v->new AlertDialog.Builder(this).setTitle(title).setMessage(message).setPositiveButton(AppPreferences.tr(this,"Понятно","OK"),null).show());\n    }\n\n'''
          if marker in text and 'private void attachInfo(TextInputLayout layout' not in text:
              text = text.replace(marker, helper + marker)
          add.write_text(text, encoding='utf-8')

          # Bring the built-in instruction up to date with the new behaviour.
          inst = Path('app/src/main/java/com/example/creditcalculator/InstructionActivity.java')
          text = inst.read_text(encoding='utf-8')
          text = text.replace(
              'Укажите, за сколько дней и в какое время напомнить. Если время не менялось, используется 09:00. Предварительное уведомление приходит без кнопки «Уже оплачено». Только в сам день платежа появляется постоянное уведомление с «✓ Уже оплачено»; оно исчезает после отметки оплаты или автоматически перестаёт быть сегодняшним после окончания дня. «Напомнить позже» остаётся доступно.',
              'Укажите, за сколько дней и в какое время напомнить. Если время не менялось, используется 09:00. Если платёж назначен на сегодня, а выбранное время уже прошло, после сохранения уведомление показывается сразу. Предварительное уведомление приходит без кнопки «Уже оплачено». Только в сам день платежа появляется постоянное уведомление с «✓ Уже оплачено»; оно исчезает после отметки оплаты или автоматически перестаёт быть сегодняшним после окончания дня. «Напомнить позже» остаётся доступно.'
          )
          text = text.replace(
              'Choose how many days before and at what time to remind you; the default is 09:00. Advance reminders do not show Already paid. Only on the actual due date an ongoing notification shows ✓ Already paid; it disappears when the payment is marked paid and is cleared after that day. Remind later remains available.',
              'Choose how many days before and at what time to remind you; the default is 09:00. If a payment is due today and the selected time has already passed, the notification is shown immediately after saving. Advance reminders do not show Already paid. Only on the actual due date an ongoing notification shows ✓ Already paid; it disappears when the payment is marked paid and is cleared after that day. Remind later remains available.'
          )
          text = text.replace(
              'В Настройки → Безопасность можно выбрать PIN приложения, пароль приложения или «Пароль / PIN устройства». Для пароля/PIN приложения есть «Показать пароль / PIN». Экран всегда напоминает текущий способ защиты. При смене способа сначала требуется текущая защита: старый PIN/пароль приложения либо системная проверка PIN, графического ключа или пароля телефона. Биометрию можно включить отдельно, если устройство её поддерживает.',
              'В Настройки → Безопасность можно выбрать PIN приложения, пароль приложения, графический ключ приложения или системный PIN/пароль/графический ключ телефона. Для PIN/пароля есть показ и скрытие введённых символов. Смена способа и полное отключение защиты всегда требуют подтверждения текущей защиты. Биометрию можно включить отдельно; если отпечаток пальца или другая биометрия ещё не добавлены на телефоне, сначала добавьте их в настройках устройства, затем вернитесь сюда.'
          )
          text = text.replace(
              'Settings → Security offers an app PIN, app password, or Device PIN/password. App secrets have a Show password/PIN option and the screen displays the current method. Changing protection first requires the current method: the old app secret or the system device-credential prompt. Biometrics can be enabled separately when supported.',
              'Settings → Security offers an app PIN, app password, app pattern, or the phone system PIN/password/pattern. PIN/password entry can be shown or hidden. Changing the method or disabling protection always requires the current protection first. Biometrics can be enabled separately; if no fingerprint or other biometric is enrolled, add it in device settings first and then return here.'
          )
          inst.write_text(text, encoding='utf-8')

          # New build number for the corrected package.
          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('versionCode 10', 'versionCode 11').replace('versionName "1.10"', 'versionName "1.11"')
          gradle.write_text(text, encoding='utf-8')
          PY

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git add app/build.gradle app/src/main/java/com/example/creditcalculator/ReminderScheduler.java app/src/main/java/com/example/creditcalculator/ReminderReceiver.java app/src/main/java/com/example/creditcalculator/AddReminderActivity.java app/src/main/java/com/example/creditcalculator/InstructionActivity.java
          git commit -m "Complete reminder permissions and help improvements"
          git push
