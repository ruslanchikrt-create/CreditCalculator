name: V115 Same-day repayment fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.15 fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # Version
          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, 'versionCode 14', 'versionCode 15', 'versionCode')
          s = replace_once(s, 'versionName "1.14"', 'versionName "1.15"', 'versionName')
          p.write_text(s, encoding='utf-8')

          # Calendar-day comparison helper. Financial actions entered as a date must not depend on reminder clock time.
          Path('app/src/main/java/com/example/creditcalculator/PaymentDateMath.java').write_text('''package com.example.creditcalculator;

import java.util.Calendar;

final class PaymentDateMath {
    private PaymentDateMath() {}

    static long startOfDay(long millis) {
        Calendar c = Calendar.getInstance();
        c.setTimeInMillis(millis);
        c.set(Calendar.HOUR_OF_DAY, 0);
        c.set(Calendar.MINUTE, 0);
        c.set(Calendar.SECOND, 0);
        c.set(Calendar.MILLISECOND, 0);
        return c.getTimeInMillis();
    }

    static boolean isSameDay(long a, long b) {
        return startOfDay(a) == startOfDay(b);
    }

    static boolean isOnOrAfterDay(long value, long reference) {
        return startOfDay(value) >= startOfDay(reference);
    }

    static boolean isBeforeDay(long value, long reference) {
        return startOfDay(value) < startOfDay(reference);
    }
}
''', encoding='utf-8')

          # Fix all repayment/refinance date-boundary calculations consistently.
          p = Path('app/src/main/java/com/example/creditcalculator/ReminderScheduler.java')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'    public static double balanceAtDate\(PaymentReminder r,long date\)\{.*?\n    public static double segmentPaidInterest', re.S)
          match = pattern.search(s)
          if not match:
              raise SystemExit('Could not locate repayment date calculation block')
          replacement = '''    public static double balanceAtDate(PaymentReminder r,long date){if(r==null)return 0;double b=r.principal;long now=System.currentTimeMillis();long actionDay=PaymentDateMath.startOfDay(date);for(int i=0;i<r.months;i++){PaymentParts p=paymentParts(r,i);if(PaymentDateMath.startOfDay(p.dueDate)>=actionDay)break;if(p.dueDate>now)b=Math.max(0,b-p.principalPart);else if(paidAmount(r,i)>0)b=Math.max(0,b-actualPrincipalPaid(r,i));}return Math.min(remainingDebt(r),b);}
    public static int remainingPaymentsAfterDate(PaymentReminder r,long date){int n=0;for(int i=0;i<r.months;i++)if(paymentAmount(r,i)>.005&&PaymentDateMath.isOnOrAfterDay(buildDueDate(r,i).getTimeInMillis(),date)&&!isPaid(r,i))n++;return n;}
    private static long firstDueOnOrAfter(PaymentReminder r,long date){for(int i=0;i<r.months;i++){long d=buildDueDate(r,i).getTimeInMillis();if(paymentAmount(r,i)>.005&&PaymentDateMath.isOnOrAfterDay(d,date)&&!isPaid(r,i))return d;}Calendar c=Calendar.getInstance();c.setTimeInMillis(PaymentDateMath.startOfDay(date));c.add(Calendar.MONTH,1);return c.getTimeInMillis();}
    private static int firstUnpaidIndexOnOrAfterDate(PaymentReminder r,long date){for(int i=0;i<r.months;i++)if(paymentAmount(r,i)>.005&&PaymentDateMath.isOnOrAfterDay(buildDueDate(r,i).getTimeInMillis(),date)&&!isPaid(r,i))return i;return Math.max(0,r.months-1);}
    public static double segmentPaidInterest'''
          s = s[:match.start()] + replacement + s[match.end():]

          old = 'public static double remainingInterestFromDate(PaymentReminder r,long date){if(r==null||TYPE_DEPOSIT.equals(normalizeType(r.type)))return 0;double t=0;for(int i=0;i<r.months;i++){PaymentParts p=paymentParts(r,i);if(p.amount<=.005||p.dueDate<date)continue;t+=Math.max(0,p.interestPart-actualInterestPaid(r,i));}return Math.max(0,t);}'
          new = 'public static double remainingInterestFromDate(PaymentReminder r,long date){if(r==null||TYPE_DEPOSIT.equals(normalizeType(r.type)))return 0;double t=0;for(int i=0;i<r.months;i++){PaymentParts p=paymentParts(r,i);if(p.amount<=.005||PaymentDateMath.isBeforeDay(p.dueDate,date))continue;t+=Math.max(0,p.interestPart-actualInterestPaid(r,i));}return Math.max(0,t);}'
          s = replace_once(s, old, new, 'remainingInterestFromDate')
          s = replace_once(s, 's.keptPayment=Math.max(.01,paymentAmount(r,Math.max(0,nextPaymentIndex(r))));', 's.keptPayment=Math.max(.01,paymentAmount(r,firstUnpaidIndexOnOrAfterDate(r,date)));', 'kept payment at action date')
          p.write_text(s, encoding='utf-8')

          # The UI date itself is a calendar date, not noon. Add an explicit hint for same-day regular payments.
          p = Path('app/src/main/java/com/example/creditcalculator/EarlyRepaymentActivity.java')
          s = p.read_text(encoding='utf-8')
          old = 'actionDate.set(Calendar.HOUR_OF_DAY,12);actionDate.set(Calendar.MINUTE,0);setContentView(build());'
          new = 'actionDate.set(Calendar.HOUR_OF_DAY,0);actionDate.set(Calendar.MINUTE,0);actionDate.set(Calendar.SECOND,0);actionDate.set(Calendar.MILLISECOND,0);setContentView(build());'
          s = replace_once(s, old, new, 'early repayment date normalization')
          old = 'Укажите дату фактического досрочного платежа. От неё пересчитываются остаток, срок и проценты.'
          new = 'Укажите дату фактического досрочного платежа. От неё пересчитываются остаток, срок и проценты. Если досрочное погашение делаете в день обычного платежа и банк уже списал этот платёж, сначала отметьте его «Оплачено» в графике. Расчёт учитывает статус оплаты, а не время на часах.'
          s = replace_once(s, old, new, 'early repayment date hint RU')
          old = 'Choose the actual early repayment date. Balance, term and interest are recalculated from this date.'
          new = 'Choose the actual early repayment date. Balance, term and interest are recalculated from this date. If an ordinary installment is due on the same day and the bank has already charged it, mark that installment Paid first. The calculation uses payment status, not the clock time.'
          s = replace_once(s, old, new, 'early repayment date hint EN')
          p.write_text(s, encoding='utf-8')

          # Update the built-in instruction as requested.
          p = Path('app/src/main/java/com/example/creditcalculator/InstructionActivity.java')
          s = p.read_text(encoding='utf-8')
          old = 'Проценты считаются помесячно от фактического остатка долга; последний платёж корректируется до точной суммы остатка, поэтому для сокращения срока нельзя просто умножать обычный платёж на количество месяцев. Можно поправить рассчитанные платёж и срок по данным банка — экономия пересчитается по введённым значениям.'
          new = 'Проценты считаются помесячно от фактического остатка долга; последний платёж корректируется до точной суммы остатка, поэтому для сокращения срока нельзя просто умножать обычный платёж на количество месяцев. Если досрочное погашение приходится на дату обычного платежа, приложение ориентируется на отметку «Оплачено», а не на часы: если банк уже списал обычный платёж, сначала отметьте его оплаченным в графике. Можно поправить рассчитанные платёж и срок по данным банка — экономия пересчитается по введённым значениям.'
          s = replace_once(s, old, new, 'instruction RU same-day note')
          old = 'Reducing the payment and reducing the term are compared side by side. You may edit calculated values to match bank figures.'
          new = 'Reducing the payment and reducing the term are compared side by side. If early repayment falls on the regular due date, payment status is used rather than the clock time; mark the ordinary installment Paid first if the bank has already charged it. You may edit calculated values to match bank figures.'
          s = replace_once(s, old, new, 'instruction EN same-day note')
          p.write_text(s, encoding='utf-8')

          # Regression tests: same calendar day must ignore hours, and the exact 325k/25%/36mo case from the reported bug must save interest.
          Path('app/src/test/java/com/example/creditcalculator/PaymentDateMathTest.java').write_text('''package com.example.creditcalculator;

import org.junit.Test;
import java.util.Calendar;
import static org.junit.Assert.*;

public class PaymentDateMathTest {
    private static long at(int year,int month,int day,int hour,int minute){
        Calendar c=Calendar.getInstance();c.clear();c.set(year,month,day,hour,minute,0);return c.getTimeInMillis();
    }

    @Test public void sameCalendarDayIgnoresClockTime(){
        long due=at(2026,Calendar.AUGUST,16,9,0);
        long action=at(2026,Calendar.AUGUST,16,15,33);
        assertTrue(PaymentDateMath.isSameDay(due,action));
        assertTrue(PaymentDateMath.isOnOrAfterDay(due,action));
        assertFalse(PaymentDateMath.isBeforeDay(due,action));
    }

    @Test public void previousAndNextCalendarDaysRemainOrdered(){
        long action=at(2026,Calendar.AUGUST,16,12,0);
        assertTrue(PaymentDateMath.isBeforeDay(at(2026,Calendar.AUGUST,15,23,59),action));
        assertTrue(PaymentDateMath.isOnOrAfterDay(at(2026,Calendar.AUGUST,17,0,1),action));
    }
}
''', encoding='utf-8')

          p = Path('app/src/test/java/com/example/creditcalculator/FinanceMathTest.java')
          s = p.read_text(encoding='utf-8')
          marker = '    @Test public void deposits(){\n        near(24000,FinanceMath.simpleDepositInterest(100000,24,12),0.01);\n        near(126973.464,FinanceMath.monthlyCompoundDepositFinal(100000,24,12),0.1);\n    }\n}'
          extra = '''    @Test public void deposits(){
        near(24000,FinanceMath.simpleDepositInterest(100000,24,12),0.01);
        near(126973.464,FinanceMath.monthlyCompoundDepositFinal(100000,24,12),0.1);
    }
    @Test public void reportedSameDayCaseHasPositiveSavings(){
        double balance=325000,prepay=1000,rate=25,currentPayment=12921.943417908074;int months=36;
        double oldInterest=FinanceMath.fixedPaymentInterest(balance,months,rate,currentPayment);
        double newBalance=balance-prepay;
        double reducedPayment=FinanceMath.annuityPayment(newBalance,months,rate);
        double reducedPaymentInterest=FinanceMath.fixedPaymentInterest(newBalance,months,rate,reducedPayment);
        int shorter=FinanceMath.monthsToPayoff(newBalance,rate,currentPayment,1200);
        double reducedTermInterest=FinanceMath.fixedPaymentInterest(newBalance,shorter,rate,currentPayment);
        near(12882.183592,reducedPayment,0.02);
        assertTrue(reducedPayment<currentPayment);
        assertEquals(36,shorter);
        assertTrue(oldInterest-reducedPaymentInterest>0);
        assertTrue(oldInterest-reducedTermInterest>0);
        assertTrue(reducedTermInterest<reducedPaymentInterest);
    }
}'''
          s = replace_once(s, marker, extra, 'FinanceMath regression tests')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run math tests and build
        run: gradle testDebugUnitTest assembleDebug

      - name: Commit v1.15 and remove temporary workflow
        run: |
          rm .github/workflows/v115-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix same-day early repayment math v1.15"
          git push
