name: Fix v1.12 MainActivity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing savings card methods
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/creditcalculator/MainActivity.java')
          source = path.read_text(encoding='utf-8')
          if 'private MaterialCardView buildBenefitCard()' not in source:
              marker = '    private View topBar()'
              methods = '''    private MaterialCardView buildBenefitCard(){MaterialCardView c=card();c.setClickable(true);c.setOnClickListener(v->startActivity(new Intent(this,BenefitHistoryActivity.class)));LinearLayout b=new LinearLayout(this);b.setOrientation(LinearLayout.VERTICAL);b.setPadding(dp(18),dp(14),dp(18),dp(14));c.addView(b);LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.HORIZONTAL);row.setGravity(Gravity.CENTER_VERTICAL);row.addView(text(AppPreferences.tr(this,"Ваша выгода","Your savings"),18,R.color.text_main,true),new LinearLayout.LayoutParams(0,-2,1f));row.addView(text("›",28,R.color.primary,true));b.addView(row);benefitValue=text("0 ₽",24,R.color.success,true);b.addView(benefitValue);b.addView(text(AppPreferences.tr(this,"Досрочные погашения и рефинансирование","Early repayments and refinancing"),12,R.color.text_secondary,false));return c;}\n    private void refreshBenefit(){if(benefitValue==null)return;double total=ReminderScheduler.totalBenefit(this);benefitValue.setText(FormatUtils.money(this,total));benefitValue.setTextColor(ContextCompat.getColor(this,total>=0?R.color.success:R.color.danger));}\n\n'''
              source = source.replace(marker, methods + marker)
              path.write_text(source, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add missing v1.12 savings card methods"
          git push
