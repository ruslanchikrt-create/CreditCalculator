name: V118 Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.18 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/src/main/java/com/example/creditcalculator/AppPreferences.java')
          s=p.read_text()
          if 'KEY_CABINET_DISCLAIMER' not in s:
              s=s.replace('    private static final String KEY_PAYMENTS_DISCLAIMER = "payments_disclaimer_accepted";\n', '    private static final String KEY_PAYMENTS_DISCLAIMER = "payments_disclaimer_accepted";\n    private static final String KEY_CABINET_DISCLAIMER = "cabinet_disclaimer_accepted";\n    private static final String KEY_CABINET_FULL_NAME = "cabinet_full_name";\n')
              s=s.replace('    public static void setPaymentsDisclaimerAccepted(Context context, boolean accepted) { prefs(context).edit().putBoolean(KEY_PAYMENTS_DISCLAIMER, accepted).apply(); }\n', '    public static void setPaymentsDisclaimerAccepted(Context context, boolean accepted) { prefs(context).edit().putBoolean(KEY_PAYMENTS_DISCLAIMER, accepted).apply(); }\n    public static boolean isCabinetDisclaimerAccepted(Context context) { return prefs(context).getBoolean(KEY_CABINET_DISCLAIMER, false); }\n    public static void setCabinetDisclaimerAccepted(Context context, boolean accepted) { prefs(context).edit().putBoolean(KEY_CABINET_DISCLAIMER, accepted).apply(); }\n    public static String getCabinetFullName(Context context) { return prefs(context).getString(KEY_CABINET_FULL_NAME, ""); }\n    public static void setCabinetFullName(Context context, String value) { prefs(context).edit().putString(KEY_CABINET_FULL_NAME, value == null ? "" : value.trim()).apply(); }\n')
          p.write_text(s)

          p=Path('app/src/main/java/com/example/creditcalculator/PaymentsActivity.java')
          s=p.read_text()
          if 'import android.app.Dialog;' not in s:
              s=s.replace('import android.content.Context;\n', 'import android.app.Dialog;\nimport android.content.Context;\n')
          if 'import android.graphics.drawable.ColorDrawable;' not in s:
              s=s.replace('import android.graphics.Color;\n', 'import android.graphics.Color;\nimport android.graphics.drawable.ColorDrawable;\n')
          if 'import android.view.Window;' not in s:
              s=s.replace('import android.view.View;\n', 'import android.view.View;\nimport android.view.Window;\n')
          start=s.index('    private void showNavigationMenu(View anchor){')
          end=s.index('    private void showInfo(String title,String message)',start)
          new='''    private void showNavigationMenu(View anchor){
        if(isFinishing())return;
        Dialog dialog=new Dialog(this);dialog.requestWindowFeature(Window.FEATURE_NO_TITLE);
        LinearLayout panel=new LinearLayout(this);panel.setOrientation(LinearLayout.VERTICAL);panel.setBackgroundColor(ContextCompat.getColor(this,R.color.card_background));
        LinearLayout header=new LinearLayout(this);header.setOrientation(LinearLayout.VERTICAL);header.setGravity(Gravity.CENTER_VERTICAL);header.setPadding(dp(22),dp(24),dp(18),dp(20));header.setBackgroundColor(ContextCompat.getColor(this,R.color.primary));panel.addView(header,new LinearLayout.LayoutParams(-1,dp(154)));
        String fio=AppPreferences.getCabinetFullName(this);String profile=fio.isEmpty()?AppPreferences.getProfileName(this):fio;if(profile.isEmpty())profile=AppPreferences.tr(this,"Финансовый калькулятор","Financial calculator");
        TextView app=text(AppPreferences.tr(this,"Финансовый калькулятор","Financial calculator"),14,R.color.white,false);header.addView(app);TextView name=text(profile,22,R.color.white,true);name.setMaxLines(3);LinearLayout.LayoutParams np=new LinearLayout.LayoutParams(-1,-2);np.setMargins(0,dp(8),0,0);header.addView(name,np);
        panel.addView(navigationItem("☷",AppPreferences.tr(this,"Мои платежи","My payments"),true,dialog,PaymentsActivity.class,false));
        panel.addView(navigationItem("▶",AppPreferences.tr(this,"Калькуляторы","Calculators"),false,dialog,MainActivity.class,true));
        panel.addView(navigationItem("↗",AppPreferences.tr(this,"Досрочный платёж","Early payment"),false,dialog,EarlyPaymentAdvisorActivity.class,false));
        panel.addView(navigationItem("▤",AppPreferences.tr(this,"Личный кабинет","Personal cabinet"),false,dialog,PersonalCabinetActivity.class,false));
        panel.addView(navigationItem("▣",AppPreferences.tr(this,"Архив","Archive"),false,dialog,ArchiveActivity.class,false));
        panel.addView(navigationItem("⌫",AppPreferences.tr(this,"Корзина","Trash"),false,dialog,TrashActivity.class,false));
        panel.addView(navigationItem("⚙",AppPreferences.tr(this,"Настройки","Settings"),false,dialog,SettingsActivity.class,false));
        View div=new View(this);div.setBackgroundColor(ContextCompat.getColor(this,R.color.border));panel.addView(div,new LinearLayout.LayoutParams(-1,dp(1)));
        panel.addView(navigationItem("ⓘ",AppPreferences.tr(this,"О приложении","About"),false,dialog,AboutActivity.class,false));
        TextView exit=navigationText("↪   "+AppPreferences.tr(this,"Выход","Exit"),false);exit.setOnClickListener(v->{dialog.dismiss();finishAffinity();});panel.addView(exit,new LinearLayout.LayoutParams(-1,dp(56)));
        dialog.setContentView(panel);dialog.setCanceledOnTouchOutside(true);dialog.show();Window w=dialog.getWindow();if(w!=null){w.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));w.setDimAmount(.45f);w.addFlags(android.view.WindowManager.LayoutParams.FLAG_DIM_BEHIND);w.setGravity(Gravity.START);w.setLayout((int)(getResources().getDisplayMetrics().widthPixels*.82f),android.view.WindowManager.LayoutParams.MATCH_PARENT);}
    }

    private TextView navigationItem(String icon,String label,boolean selected,Dialog dialog,Class<?> target,boolean calculators){
        TextView item=navigationText(icon+"   "+label,selected);item.setOnClickListener(v->{dialog.dismiss();if(target==PaymentsActivity.class)return;Intent i=new Intent(this,target);if(calculators)i.putExtra(MainActivity.EXTRA_SHOW_CALCULATORS,true);startActivity(i);});return item;
    }
    private TextView navigationText(String value,boolean selected){TextView t=new TextView(this);t.setText(value);t.setTextSize(17);t.setGravity(Gravity.CENTER_VERTICAL);t.setPadding(dp(22),0,dp(12),0);t.setTextColor(ContextCompat.getColor(this,selected?R.color.primary:R.color.text_main));if(selected){t.setTypeface(null,android.graphics.Typeface.BOLD);t.setBackgroundColor(Color.argb(24,47,111,235));}return t;}

'''
          s=s[:start]+new+s[end:]
          p.write_text(s)

          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<activity android:name=".PaymentsActivity" android:exported="false" android:windowSoftInputMode="adjustResize" />','''<activity android:name=".PaymentsActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>''')
          s=re.sub(r'\n        <activity\n            android:name="\.MainActivity"\n            android:exported="true"\n            android:windowSoftInputMode="adjustResize">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>', '\n        <activity android:name=".MainActivity" android:exported="false" android:windowSoftInputMode="adjustResize" />',s)
          p.write_text(s)

          p=Path('app/src/main/java/com/example/creditcalculator/LanguageSelectionActivity.java')
          s=p.read_text().replace('Intent i = new Intent(this, MainActivity.class); i.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP); startActivity(i); finish();','Intent i = new Intent(this, PaymentsActivity.class); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK); startActivity(i); finish();')
          p.write_text(s)

          p=Path('app/src/main/java/com/example/creditcalculator/InstructionActivity.java')
          s=p.read_text()
          s=s.replace('В меню доступен «Личный кабинет». Здесь можно указать ежемесячный доход, другие обязательные платежи, известный официальный рейтинг БКИ, количество кредитных заявок и отказов. Приложение автоматически показывает активные и архивные кредиты, долг, платёжную дисциплину, просрочки и долговую нагрузку. На их основе рассчитывается внутренняя оценка «Кредитное здоровье» 0–100. Это не официальный рейтинг БКИ. Возле показателей есть ⓘ с объяснением расчёта и источника данных.','В меню доступен «Личный кабинет». Здесь можно указать ФИО, ежемесячный доход, другие обязательные платежи, известный официальный рейтинг БКИ, количество кредитных заявок и отказов. Денежные поля форматируются пробелами, а долговая нагрузка и кредитное здоровье пересчитываются сразу при вводе. Нажмите «Сохранить», чтобы записать введённые данные. Потяните страницу вниз, чтобы перечитать платежи, архив и просрочки и обновить показатели. Приложение автоматически показывает активные и архивные кредиты, долг, платёжную дисциплину, просрочки и долговую нагрузку. На их основе рассчитывается внутренняя оценка «Кредитное здоровье» 0–100. Это не официальный рейтинг БКИ. Возле показателей есть ⓘ с объяснением расчёта и источника данных.')
          s=s.replace('При первом входе в «Мои платежи» показывается обязательное информационное предупреждение: расчёты ориентировочные и могут отличаться от данных банка. После кнопки «Понятно, продолжить» предупреждение больше не мешает работе и появится снова только после очистки данных/полного сброса. В «Мои платежи» и «Личном кабинете» возле основных показателей есть ⓘ: нажмите, чтобы узнать, что означает показатель, как он считается и какие данные в него входят.','При первом входе в «Мои платежи» показывается обязательное информационное предупреждение: расчёты ориентировочные и могут отличаться от данных банка. При первом входе в «Личный кабинет» отдельно показывается предупреждение, что кредитное здоровье, платёжная дисциплина и долговая нагрузка — внутренние ориентировочные показатели, а не официальный рейтинг БКИ или решение банка. После кнопки «Понятно, продолжить» каждое предупреждение появляется снова только после очистки данных/полного сброса. В «Мои платежи» и «Личном кабинете» возле основных показателей есть ⓘ: нажмите, чтобы узнать, что означает показатель, как он считается и какие данные в него входят.')
          s=s.replace('При обычном входе после проверки защиты приложение открывает раздел «Мои платежи»; к калькуляторам можно вернуться кнопкой назад или через меню.','При обычном входе после проверки защиты приложение напрямую открывает раздел «Мои платежи». Калькуляторы остаются доступны через боковое меню. В «Мои платежи» меню выезжает слева и затемняет остальную часть экрана.')
          p.write_text(s)

          p=Path('app/build.gradle')
          s=p.read_text().replace('versionCode 17','versionCode 18').replace('versionName "1.17"','versionName "1.18"')
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build
        run: gradle testDebugUnitTest assembleDebug

      - name: Commit v1.18 and remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/v118-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve personal cabinet and navigation v1.18"
          git push
