name: Cleanup v1.9 temporary CI

on:
  push:
    branches:
      - v1.9-work
    paths:
      - .github/v19-cleanup-trigger.txt

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.9-work
      - name: Remove temporary v1.9 workflows and triggers
        run: |
          git rm -f \
            .github/workflows/build-v19-test.yml \
            .github/workflows/apply-v19-fixes.yml \
            .github/workflows/apply-v19-final-fixes.yml \
            .github/workflows/apply-v19-differential.yml \
            .github/workflows/apply-v19-lint-fixes.yml \
            .github/workflows/apply-v19-uri-lint.yml \
            .github/workflows/apply-v19-notification-lint.yml \
            .github/workflows/cleanup-v19.yml \
            .github/v19-test-trigger.txt \
            .github/v19-fix-trigger.txt \
            .github/v19-final-fix-trigger.txt \
            .github/v19-differential-trigger.txt \
            .github/v19-lint-fix-trigger.txt \
            .github/v19-uri-fix-trigger.txt \
            .github/v19-notification-fix-trigger.txt \
            .github/v19-cleanup-trigger.txt
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary v1.9 CI helpers"
          git push origin HEAD:v1.9-work
