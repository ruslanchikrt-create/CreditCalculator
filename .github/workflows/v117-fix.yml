name: V117 Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
