name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  credit-calculator:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build debug + release APK
        run: gradle testDebugUnitTest assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CreditCalculator-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: CreditCalculator-Release-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  mathprogress:
    if: github.event_name == 'pull_request' && github.head_ref == 'mathprogress-app'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Clean duplicated declarations in build workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MathProgress/app/src/main/java/com/mathprogress/app/MainActivity.kt')
          lines = p.read_text().splitlines(True)
          targets = {
              'private var onboardingActive = false',
              'private val feedbackAttachments = mutableListOf<Uri>()',
              'private var feedbackIsError = true',
              'private var feedbackDraft = ""',
              'private var practiceDifficulty = 1',
              'private var practiceAdaptive = false',
              'private var practiceUserAnswer = ""',
              'private var dailyUserAnswer = ""',
              'const val REQ_FEEDBACK_MEDIA = 105',
          }
          seen = set(); out = []
          for line in lines:
              key = line.strip()
              if key in targets:
                  if key in seen: continue
                  seen.add(key)
              out.append(line)
          p.write_text(''.join(out))
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build MathProgress APK
        working-directory: MathProgress
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare APK
        run: cp MathProgress/app/build/outputs/apk/debug/app-debug.apk MathProgress-v0.4.0.apk
      - name: Upload MathProgress APK
        uses: actions/upload-artifact@v4
        with:
          name: MathProgress-v0.4.0-APK
          path: MathProgress-v0.4.0.apk
          if-no-files-found: error
