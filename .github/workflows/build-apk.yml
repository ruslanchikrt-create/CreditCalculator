name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mathprogress-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply prepared MathProgress v0.4.0 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/build-mathprogress.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          lines = src[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          compile(code, 'apply_v040.py', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

      - name: Persist source changes
        run: |
          if ! git diff --quiet -- MathProgress; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add MathProgress
            git commit -m "Apply MathProgress v0.4.0 source update"
            git push origin HEAD:mathprogress-app || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build MathProgress debug APK
        working-directory: MathProgress
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: cp MathProgress/app/build/outputs/apk/debug/app-debug.apk MathProgress-v0.4.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MathProgress-v0.4.0-APK
          path: MathProgress-v0.4.0.apk
          if-no-files-found: error
