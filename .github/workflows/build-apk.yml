name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  clean-mathprogress-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MathProgress branch
        uses: actions/checkout@v4
        with:
          ref: mathprogress-app
      - name: Clean duplicate declarations and persist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MathProgress/app/src/main/java/com/mathprogress/app/MainActivity.kt')
          lines = p.read_text().splitlines(True)
          targets = {
              'private var onboardingActive = false',
              'private val feedbackAttachments = mutableListOf<Uri>()',
              'private var feedbackIsError = true',
              'private var feedbackDraft = ""',
              'private var practiceDifficulty = 1',
              'private var practiceAdaptive = false',
              'private var practiceUserAnswer = ""',
              'private var dailyUserAnswer = ""',
              'const val REQ_FEEDBACK_MEDIA = 105',
          }
          seen=set(); out=[]
          for line in lines:
              key=line.strip()
              if key in targets:
                  if key in seen:
                      continue
                  seen.add(key)
              out.append(line)
          p.write_text(''.join(out))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MathProgress/app/src/main/java/com/mathprogress/app/MainActivity.kt
          git commit -m "Clean MathProgress v0.4.0 source declarations" || true
          git push origin HEAD:mathprogress-app || true
