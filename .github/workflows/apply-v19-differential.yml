name: Apply v1.9 differential consistency

on:
  push:
    branches:
      - v1.9-work
    paths:
      - .github/v19-differential-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.9-work
      - name: Apply differential-loan fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/src/main/java/com/example/creditcalculator/ReminderScheduler.java')
          s=p.read_text()

          # Refinance simulation carries the chosen payment type.
          old='''        public double newPayment;\n        public double newOverpayment;\n        public double savings;\n        public long firstNewPayment;'''
          new='''        public double newPayment;\n        public double newOverpayment;\n        public double savings;\n        public long firstNewPayment;\n        public String paymentType;'''
          if old not in s: raise SystemExit('refinance fields target not found')
          s=s.replace(old,new,1)

          # Differential schedule uses the stored first payment to derive the equal principal part.\n          # This lets bank-provided/manual first-payment corrections remain meaningful after early repayment.
          old='''if(PAYMENT_DIFFERENTIAL.equals(normalizePaymentType(r.paymentType))&&!TYPE_INSTALLMENT.equals(normalizeType(r.type))){double fixed=r.months<=0?balance:r.principal/r.months;principalPart=Math.min(balance,fixed);amount=principalPart+interest;if(e!=null&&e.plannedOverride>0){amount=e.plannedOverride;principalPart=Math.max(0,Math.min(balance,amount-interest));}}else'''
          new='''if(PAYMENT_DIFFERENTIAL.equals(normalizePaymentType(r.paymentType))&&!TYPE_INSTALLMENT.equals(normalizeType(r.type))){double theoretical=r.months<=0?balance:r.principal/r.months;double firstInterest=Math.max(0,r.principal*monthly);double fixed=r.amount>firstInterest+.005?r.amount-firstInterest:theoretical;if(fixed<=0)fixed=theoretical;principalPart=Math.min(balance,fixed);amount=principalPart+interest;if(e!=null&&e.plannedOverride>0){amount=e.plannedOverride;principalPart=Math.max(0,Math.min(balance,amount-interest));}if(i==r.months-1&&balance>principalPart+.005){principalPart=balance;amount=balance+interest;}}else'''
          if old not in s: raise SystemExit('differential schedule target not found')
          s=s.replace(old,new,1)

          # Replace early-repayment simulation with payment-type-aware calculations.
          old='''public static EarlyRepaymentSimulation simulateEarlyRepayment(PaymentReminder r,long date,double prepayment){if(r==null||prepayment<=0)throw new IllegalArgumentException();double balance=balanceAtDate(r,date);if(balance<=0||prepayment>balance+.01)throw new IllegalArgumentException();int remaining=Math.max(1,remainingPaymentsAfterDate(r,date));EarlyRepaymentSimulation s=new EarlyRepaymentSimulation();s.balance=balance;s.prepayment=Math.min(prepayment,balance);s.newBalance=Math.max(0,balance-s.prepayment);s.remainingMonths=remaining;s.firstFuturePayment=firstDueOnOrAfter(r,date);s.oldRemainingInterest=remainingInterest(r);if(s.newBalance<=.01){s.reducedPayment=0;s.interestWithReducedPayment=0;s.savingsWithReducedPayment=s.oldRemainingInterest;s.reducedMonths=0;s.keptPayment=0;s.interestWithReducedTerm=0;s.savingsWithReducedTerm=s.oldRemainingInterest;return s;}s.reducedPayment=annuity(s.newBalance,remaining,r.annualRate);s.interestWithReducedPayment=futureInterest(s.newBalance,r.annualRate,s.reducedPayment,remaining);s.savingsWithReducedPayment=Math.max(0,s.oldRemainingInterest-s.interestWithReducedPayment);s.keptPayment=Math.max(.01,paymentAmount(r,Math.max(0,nextPaymentIndex(r))));s.reducedMonths=monthsForPayment(s.newBalance,r.annualRate,s.keptPayment,remaining);s.interestWithReducedTerm=futureInterest(s.newBalance,r.annualRate,s.keptPayment,s.reducedMonths);s.savingsWithReducedTerm=Math.max(0,s.oldRemainingInterest-s.interestWithReducedTerm);return s;}'''
          new='''public static EarlyRepaymentSimulation simulateEarlyRepayment(PaymentReminder r,long date,double prepayment){if(r==null||prepayment<=0)throw new IllegalArgumentException();double balance=balanceAtDate(r,date);if(balance<=0||prepayment>balance+.01)throw new IllegalArgumentException();int remaining=Math.max(1,remainingPaymentsAfterDate(r,date));EarlyRepaymentSimulation s=new EarlyRepaymentSimulation();s.balance=balance;s.prepayment=Math.min(prepayment,balance);s.newBalance=Math.max(0,balance-s.prepayment);s.remainingMonths=remaining;s.firstFuturePayment=firstDueOnOrAfter(r,date);s.oldRemainingInterest=remainingInterest(r);if(s.newBalance<=.01){s.reducedPayment=0;s.interestWithReducedPayment=0;s.savingsWithReducedPayment=s.oldRemainingInterest;s.reducedMonths=0;s.keptPayment=0;s.interestWithReducedTerm=0;s.savingsWithReducedTerm=s.oldRemainingInterest;return s;}boolean diff=PAYMENT_DIFFERENTIAL.equals(normalizePaymentType(r.paymentType));if(diff){s.reducedPayment=differentialFirstPayment(s.newBalance,remaining,r.annualRate);s.interestWithReducedPayment=differentialTotalInterest(s.newBalance,remaining,r.annualRate);s.savingsWithReducedPayment=Math.max(0,s.oldRemainingInterest-s.interestWithReducedPayment);double monthly=r.annualRate/100d/12d;double firstInterest=r.principal*monthly;double principalPart=r.amount>firstInterest+.005?r.amount-firstInterest:(r.months>0?r.principal/r.months:r.principal);if(principalPart<=0)principalPart=s.newBalance/remaining;s.reducedMonths=Math.max(1,(int)Math.ceil(s.newBalance/principalPart));s.keptPayment=Math.min(principalPart,s.newBalance)+s.newBalance*monthly;s.interestWithReducedTerm=differentialInterestWithFirstPayment(s.newBalance,s.reducedMonths,r.annualRate,s.keptPayment);s.savingsWithReducedTerm=Math.max(0,s.oldRemainingInterest-s.interestWithReducedTerm);}else{s.reducedPayment=annuity(s.newBalance,remaining,r.annualRate);s.interestWithReducedPayment=futureInterest(s.newBalance,r.annualRate,s.reducedPayment,remaining);s.savingsWithReducedPayment=Math.max(0,s.oldRemainingInterest-s.interestWithReducedPayment);s.keptPayment=Math.max(.01,paymentAmount(r,Math.max(0,nextPaymentIndex(r))));s.reducedMonths=monthsForPayment(s.newBalance,r.annualRate,s.keptPayment,remaining);s.interestWithReducedTerm=futureInterest(s.newBalance,r.annualRate,s.keptPayment,s.reducedMonths);s.savingsWithReducedTerm=Math.max(0,s.oldRemainingInterest-s.interestWithReducedTerm);}return s;}'''
          if old not in s: raise SystemExit('early simulation target not found')
          s=s.replace(old,new,1)

          # Refinance: overload supports annuity or differential new credit.
          old='''    public static RefinanceSimulation simulateRefinance(PaymentReminder r,long date,double newRate,int newMonths,double commission,double insurance){return simulateRefinance(r,date,newRate,newMonths,commission,insurance,0);}\n    public static RefinanceSimulation simulateRefinance(PaymentReminder r,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal){if(r==null||newRate<0||newMonths<=0||commission<0||insurance<0)throw new IllegalArgumentException();RefinanceSimulation s=new RefinanceSimulation();s.balance=balanceAtDate(r,date);if(s.balance<=0)throw new IllegalArgumentException();s.oldRemainingMonths=Math.max(1,remainingPaymentsAfterDate(r,date));s.oldRemainingOverpayment=remainingInterest(r);s.commission=commission;s.insurance=insurance;s.newPrincipal=requestedPrincipal>0?requestedPrincipal:s.balance+commission+insurance;s.newRate=newRate;s.newMonths=newMonths;s.newPayment=annuity(s.newPrincipal,newMonths,newRate);double total=s.newPayment*newMonths;s.newOverpayment=Math.max(0,total-s.balance);s.savings=s.oldRemainingOverpayment-s.newOverpayment;Calendar cal=Calendar.getInstance();cal.setTimeInMillis(date);cal.add(Calendar.MONTH,1);s.firstNewPayment=cal.getTimeInMillis();return s;}\n    public static void applyRefinance(Context c,long id,long date,double newRate,int newMonths,double commission,double insurance){applyRefinance(c,id,date,newRate,newMonths,commission,insurance,0);}\n    public static void applyRefinance(Context c,long id,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal){List<PaymentReminder> items=loadAll(c);for(PaymentReminder r:items)if(r.id==id){RefinanceSimulation s=simulateRefinance(r,date,newRate,newMonths,commission,insurance,requestedPrincipal);cancel(c,r);double oldRate=r.annualRate,oldPayment=paymentAmount(r,Math.max(0,nextPaymentIndex(r)));int oldMonths=s.oldRemainingMonths;r.interestPaidBefore+=segmentPaidInterest(r);r.principal=s.newPrincipal;r.annualRate=newRate;r.months=newMonths;r.amount=s.newPayment;r.paymentType=PAYMENT_ANNUITY;r.firstPaymentMillis=s.firstNewPayment;r.ledgerJson="";r.updatedAt=System.currentTimeMillis();appendHistory(r,r.updatedAt,HISTORY_REFINANCE,"Рефинансирование","Refinancing","Остаток: "+round2(s.balance)+" ₽\\nСтавка: "+round2(oldRate)+"% → "+round2(newRate)+"%\\nПлатёж: "+round2(oldPayment)+" ₽ → "+round2(s.newPayment)+" ₽\\nСрок: "+oldMonths+" → "+newMonths+" мес.\\nКомиссия: "+round2(commission)+" ₽\\nСтраховка: "+round2(insurance)+" ₽\\nРасчётная экономия: "+round2(s.savings)+" ₽","Refinancing applied. Estimated savings: "+round2(s.savings)+" ₽");saveRaw(c,items);schedule(c,r);return;}}'''
          new='''    public static RefinanceSimulation simulateRefinance(PaymentReminder r,long date,double newRate,int newMonths,double commission,double insurance){return simulateRefinance(r,date,newRate,newMonths,commission,insurance,0,PAYMENT_ANNUITY);}\n    public static RefinanceSimulation simulateRefinance(PaymentReminder r,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal){return simulateRefinance(r,date,newRate,newMonths,commission,insurance,requestedPrincipal,PAYMENT_ANNUITY);}\n    public static RefinanceSimulation simulateRefinance(PaymentReminder r,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal,String paymentType){if(r==null||newRate<0||newMonths<=0||commission<0||insurance<0)throw new IllegalArgumentException();RefinanceSimulation s=new RefinanceSimulation();s.balance=balanceAtDate(r,date);if(s.balance<=0)throw new IllegalArgumentException();s.oldRemainingMonths=Math.max(1,remainingPaymentsAfterDate(r,date));s.oldRemainingOverpayment=remainingInterest(r);s.commission=commission;s.insurance=insurance;s.newPrincipal=requestedPrincipal>0?requestedPrincipal:s.balance+commission+insurance;s.newRate=newRate;s.newMonths=newMonths;s.paymentType=normalizePaymentType(paymentType);if(PAYMENT_DIFFERENTIAL.equals(s.paymentType)){s.newPayment=differentialFirstPayment(s.newPrincipal,newMonths,newRate);s.newOverpayment=Math.max(0,(s.newPrincipal+differentialTotalInterest(s.newPrincipal,newMonths,newRate))-s.balance);}else{s.newPayment=annuity(s.newPrincipal,newMonths,newRate);double total=s.newPayment*newMonths;s.newOverpayment=Math.max(0,total-s.balance);}s.savings=s.oldRemainingOverpayment-s.newOverpayment;Calendar cal=Calendar.getInstance();cal.setTimeInMillis(date);cal.add(Calendar.MONTH,1);s.firstNewPayment=cal.getTimeInMillis();return s;}\n    public static void applyRefinance(Context c,long id,long date,double newRate,int newMonths,double commission,double insurance){applyRefinance(c,id,date,newRate,newMonths,commission,insurance,0,PAYMENT_ANNUITY);}\n    public static void applyRefinance(Context c,long id,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal){applyRefinance(c,id,date,newRate,newMonths,commission,insurance,requestedPrincipal,PAYMENT_ANNUITY);}\n    public static void applyRefinance(Context c,long id,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal,String paymentType){List<PaymentReminder> items=loadAll(c);for(PaymentReminder r:items)if(r.id==id){RefinanceSimulation s=simulateRefinance(r,date,newRate,newMonths,commission,insurance,requestedPrincipal,paymentType);cancel(c,r);double oldRate=r.annualRate,oldPayment=paymentAmount(r,Math.max(0,nextPaymentIndex(r)));int oldMonths=s.oldRemainingMonths;r.interestPaidBefore+=segmentPaidInterest(r);r.principal=s.newPrincipal;r.annualRate=newRate;r.months=newMonths;r.amount=s.newPayment;r.paymentType=s.paymentType;r.firstPaymentMillis=s.firstNewPayment;r.ledgerJson="";r.updatedAt=System.currentTimeMillis();appendHistory(r,r.updatedAt,HISTORY_REFINANCE,"Рефинансирование","Refinancing","Остаток: "+round2(s.balance)+" ₽\\nСтавка: "+round2(oldRate)+"% → "+round2(newRate)+"%\\nТип платежей: "+s.paymentType+"\\nПлатёж: "+round2(oldPayment)+" ₽ → "+round2(s.newPayment)+" ₽\\nСрок: "+oldMonths+" → "+newMonths+" мес.\\nКомиссия: "+round2(commission)+" ₽\\nСтраховка: "+round2(insurance)+" ₽\\nРасчётная экономия: "+round2(s.savings)+" ₽","Refinancing applied. Payment type: "+s.paymentType+". Estimated savings: "+round2(s.savings)+" ₽");saveRaw(c,items);schedule(c,r);return;}}'''
          if old not in s: raise SystemExit('refinance block target not found')
          s=s.replace(old,new,1)

          anchor='''    public static double differentialTotalInterest(double principal,int months,double rate){if(months<=0)return 0;double part=principal/months,b=principal,m=rate/100d/12d,t=0;for(int i=0;i<months;i++){t+=b*m;b=Math.max(0,b-part);}return t;}'''
          helper=anchor+'''\n    public static double differentialInterestWithFirstPayment(double principal,int months,double rate,double firstPayment){if(principal<=0||months<=0)return 0;double m=rate/100d/12d;double firstInterest=principal*m;double part=firstPayment>firstInterest+.005?firstPayment-firstInterest:principal/months;if(part<=0)part=principal/months;double b=principal,t=0;for(int i=0;i<months&&b>.005;i++){t+=b*m;b=Math.max(0,b-Math.min(part,b));}return Math.max(0,t);}'''
          if anchor not in s: raise SystemExit('differential helper anchor not found')
          s=s.replace(anchor,helper,1)
          p.write_text(s)

          # EarlyRepaymentActivity: manual comparison calculations respect differential schedules.
          p=Path('app/src/main/java/com/example/creditcalculator/EarlyRepaymentActivity.java')
          s=p.read_text()
          old='''double li=Math.max(0,lp*lm-sim.newBalance),ri=Math.max(0,rp*rm-sim.newBalance),ls=sim.oldRemainingInterest-li,rs=sim.oldRemainingInterest-ri;'''
          new='''boolean diff=ReminderScheduler.PAYMENT_DIFFERENTIAL.equals(ReminderScheduler.normalizePaymentType(reminder.paymentType));double li=diff?ReminderScheduler.differentialInterestWithFirstPayment(sim.newBalance,lm,reminder.annualRate,lp):Math.max(0,lp*lm-sim.newBalance),ri=diff?ReminderScheduler.differentialInterestWithFirstPayment(sim.newBalance,rm,reminder.annualRate,rp):Math.max(0,rp*rm-sim.newBalance),ls=sim.oldRemainingInterest-li,rs=sim.oldRemainingInterest-ri;'''
          if old not in s: raise SystemExit('early manual math target not found')
          p.write_text(s.replace(old,new,1))

          # RefinanceActivity: user chooses payment type for the new loan.
          p=Path('app/src/main/java/com/example/creditcalculator/RefinanceActivity.java')
          s=p.read_text()
          s=s.replace('import android.widget.ScrollView;','import android.widget.ScrollView;\nimport android.widget.Spinner;')
          s=s.replace('''    private TextInputEditText rateInput,monthsInput,commissionInput,insuranceInput,dateInput,principalInput;''','''    private TextInputEditText rateInput,monthsInput,commissionInput,insuranceInput,dateInput,principalInput;\n    private Spinner paymentTypeSpinner;''')
          old='''principalInput=field(content,AppPreferences.tr(this,"Новая сумма кредита, ₽","New loan amount, ₽"),InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL);dateInput=field'''
          new='''principalInput=field(content,AppPreferences.tr(this,"Новая сумма кредита, ₽","New loan amount, ₽"),InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL);TextView ptl=text(AppPreferences.tr(this,"Тип платежей нового кредита","New loan payment type"),14,R.color.text_secondary,true);LinearLayout.LayoutParams ptlp=new LinearLayout.LayoutParams(-1,-2);ptlp.setMargins(0,0,0,dp(6));content.addView(ptl,ptlp);paymentTypeSpinner=new Spinner(this);UiUtils.styleSpinner(this,paymentTypeSpinner);paymentTypeSpinner.setAdapter(UiUtils.spinnerAdapter(this,new String[]{AppPreferences.tr(this,"Аннуитетный","Annuity"),AppPreferences.tr(this,"Дифференцированный","Differential")}));LinearLayout.LayoutParams ptsp=new LinearLayout.LayoutParams(-1,dp(56));ptsp.setMargins(0,0,0,dp(12));content.addView(paymentTypeSpinner,ptsp);paymentTypeSpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener(){public void onItemSelected(android.widget.AdapterView<?> p,View v,int pos,long id){if(!binding)recalculate();}public void onNothingSelected(android.widget.AdapterView<?> p){}});dateInput=field'''
          if old not in s: raise SystemExit('refi spinner insertion target not found')
          s=s.replace(old,new,1)
          old='''sim=ReminderScheduler.simulateRefinance(reminder,date.getTimeInMillis(),rate,months,fee,ins,principal);'''
          new='''String paymentType=paymentTypeSpinner!=null&&paymentTypeSpinner.getSelectedItemPosition()==1?ReminderScheduler.PAYMENT_DIFFERENTIAL:ReminderScheduler.PAYMENT_ANNUITY;sim=ReminderScheduler.simulateRefinance(reminder,date.getTimeInMillis(),rate,months,fee,ins,principal,paymentType);'''
          if old not in s: raise SystemExit('refi simulate target not found')
          s=s.replace(old,new,1)
          old='''ReminderScheduler.applyRefinance(this,reminder.id,date.getTimeInMillis(),zero(rateInput.getText().toString()),positiveInt(monthsInput.getText().toString()),zero(commissionInput.getText().toString()),zero(insuranceInput.getText().toString()),positive(principalInput.getText().toString()));'''
          new='''String paymentType=paymentTypeSpinner!=null&&paymentTypeSpinner.getSelectedItemPosition()==1?ReminderScheduler.PAYMENT_DIFFERENTIAL:ReminderScheduler.PAYMENT_ANNUITY;ReminderScheduler.applyRefinance(this,reminder.id,date.getTimeInMillis(),zero(rateInput.getText().toString()),positiveInt(monthsInput.getText().toString()),zero(commissionInput.getText().toString()),zero(insuranceInput.getText().toString()),positive(principalInput.getText().toString()),paymentType);'''
          if old not in s: raise SystemExit('refi apply target not found')
          s=s.replace(old,new,1)
          # Default to current payment type for convenience.
          old='''principalInput.setText(num(ReminderScheduler.remainingDebt(reminder)));binding=false;recalculate();'''
          new='''principalInput.setText(num(ReminderScheduler.remainingDebt(reminder)));if(paymentTypeSpinner!=null)paymentTypeSpinner.setSelection(ReminderScheduler.PAYMENT_DIFFERENTIAL.equals(ReminderScheduler.normalizePaymentType(reminder.paymentType))?1:0);binding=false;recalculate();'''
          if old not in s: raise SystemExit('refi default target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep differential loans consistent across actions"
          git push origin HEAD:v1.9-work
