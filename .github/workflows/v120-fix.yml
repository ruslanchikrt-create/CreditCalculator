                          "El resumen solo incluye registros activos. Los créditos archivados no se incluyen. Desliza hacia abajo para actualizar. El orden se elige con el botón Ordenar; por defecto, el pago más cercano."));

                  expandable(content,local("4. Ваша выгода, досрочное погашение и рефинансирование","4. Savings, early repayment and refinancing","4. Tasarruf, erken ödeme ve refinansman","4. Ahorro, amortización anticipada y refinanciación"),local(
                          "В карточке «Ваша выгода» показывается расчётная экономия только по активным кредитам. Там же показывается «Досрочно погашено по активным кредитам» — сумма всех зарегистрированных досрочных погашений за всё время по кредитам, которые сейчас активны. Это не показатель только текущего месяца. Как только кредит полностью закрывается и переходит в архив, его досрочные погашения и выгода перестают входить в активную карточку, но сохраняются в архиве и «Финансовой статистике». Досрочный платёж не смешивается с обычным ежемесячным платежом. При досрочном погашении можно уменьшить срок, уменьшить платёж или внести всю текущую сумму долга.",
                          "Your savings shows estimated savings for active loans only. It also shows lifetime early repayments for loans that are currently active. Once a loan is archived, its early repayments and savings leave the active card but remain in archive and Financial statistics. Early repayment is kept separate from normal installments.",
                          "Tasarruf kartı yalnızca aktif kredileri içerir. Aktif kredilerin tüm erken ödemeleri ayrıca gösterilir. Kredi arşive geçtiğinde bu veriler aktif karttan çıkar ancak arşivde ve Finansal istatistiklerde kalır.",
                          "La tarjeta Ahorro solo incluye créditos activos. También muestra todas las amortizaciones anticipadas de los créditos que siguen activos. Al archivar un crédito, esos datos salen de la tarjeta activa pero permanecen en el archivo y en Estadísticas financieras."));

                  expandable(content,local("5. Финансовая статистика","5. Financial statistics","5. Finansal istatistikler","5. Estadísticas financieras"),local(
                          "Раздел «Финансовая статистика» находится в боковом меню и доступен также из «Личного кабинета». Он собирает активные и архивные данные, но не учитывает Корзину. Здесь показываются: сколько всего внесено по кредитам; сколько обычных платежей отмечено оплаченными; сколько внесено досрочно; сколько процентов уже выплачено; какая часть выплаченных процентов относится к архивным кредитам; сколько будущих процентов осталось по активным кредитам; текущий общий долг; выгода активных, архивных и всех кредитов; сумма активных вкладов; ожидаемый доход по активным вкладам; расчётный доход завершённых вкладов; количество активных и завершённых записей. У каждого показателя есть ⓘ с объяснением. Доход завершённых вкладов рассчитывается по сохранённым условиям и может отличаться от фактической суммы банка.",
                          "Financial statistics is available in the side menu and from Personal cabinet. It combines active and archived data, excluding Trash. It shows lifetime loan payments, early repayments, interest already paid, archived interest, future active interest, current debt, savings, active deposits, expected deposit income, estimated completed-deposit income and record counts. Every metric has an ⓘ explanation.",
                          "Finansal istatistikler yan menüde ve Kişisel alanda bulunur. Aktif ve arşiv verilerini birleştirir, Çöp kutusunu hariç tutar. Tüm göstergelerde ⓘ açıklaması vardır.",
                          "Estadísticas financieras está en el menú lateral y en Área personal. Combina datos activos y archivados, excluye Papelera y ofrece una explicación ⓘ para cada indicador."));

                  expandable(content,local("6. Личный кабинет","6. Personal cabinet","6. Kişisel alan","6. Área personal"),local(
                          "В «Личном кабинете» можно сохранить ФИО, ежемесячный доход, другие обязательные платежи, известный рейтинг БКИ, количество заявок и отказов. Денежные поля форматируются, а долговая нагрузка и внутреннее «Кредитное здоровье» пересчитываются при вводе. Кнопка «Сохранить» фиксирует введённые данные. Потяните страницу вниз, чтобы обновить кредиты и расчёты. «Кредитное здоровье» — внутренняя ориентировочная оценка приложения, а не официальный рейтинг БКИ. Отсюда можно открыть «Финансовую статистику».",
                          "Personal cabinet stores full name, income, other obligations, an optional bureau score, applications and rejections. Debt burden and internal Credit health update while typing. Save stores manual fields; pull down refreshes loan data. Credit health is not an official bureau score. Financial statistics can be opened from here.",
                          "Kişisel alanda ad, gelir, diğer yükümlülükler ve kredi bürosu bilgileri saklanabilir. Kredi sağlığı resmi bir büro puanı değildir.",
                          "En Área personal puedes guardar nombre, ingresos, otras obligaciones y datos del buró. Salud crediticia no es una puntuación oficial del buró."));

                  expandable(content,local("7. Архив и Корзина","7. Archive and Trash","7. Arşiv ve Çöp kutusu","7. Archivo y Papelera"),local(
                          "Полностью закрытый кредит переносится в архив и перестаёт участвовать в активной сводке и активной выгоде. Его история, досрочные погашения и выгода сохраняются для истории и статистики. Обычная оплата одного ежемесячного платежа не закрывает весь кредит. Корзина предназначена для удалённых записей и не участвует в «Финансовой статистике».",
                          "A fully closed loan moves to archive and is excluded from active summary and savings, while history remains available for statistics. Paying one installment does not archive the whole loan. Trash is excluded from Financial statistics.",
                          "Tam kapanan kredi arşive gider; geçmişi istatistiklerde kalır. Tek bir taksiti ödemek krediyi tamamen kapatmaz. Çöp kutusu istatistiklere dahil değildir.",
                          "Un crédito totalmente cerrado pasa al archivo; su historial permanece en las estadísticas. Pagar una cuota no archiva todo el crédito. Papelera no se incluye en las estadísticas."));

                  expandable(content,local("8. Напоминания и отметка оплаты","8. Reminders and marking payments","8. Hatırlatmalar ve ödeme işareti","8. Recordatorios y marcar pagos"),local(
                          "В день платежа с 00:00 может показываться постоянное беззвучное уведомление, которое исчезает после отметки «Оплачено». В выбранное время отдельное звуковое напоминание срабатывает только для нерешённого платежа. Если платёж был отмечен ошибочно, его можно восстановить через архив платежей внутри графика записи. Досрочное погашение и обычный платёж учитываются отдельно.",
                          "On payment day a persistent silent notice can stay until the installment is marked paid. A separate sound reminder runs only for unresolved payments. An accidentally paid installment can be restored from the schedule's paid-payment archive. Early repayment and normal installments are tracked separately.",
                          "Ödeme gününde sessiz kalıcı bildirim ödeme işaretlenene kadar kalabilir. Erken ödeme ve normal taksitler ayrı izlenir.",
                          "El día de pago puede permanecer un aviso silencioso hasta marcar la cuota como pagada. La amortización anticipada y la cuota normal se registran por separado."));

                  expandable(content,local("9. Безопасность","9. Security","9. Güvenlik","9. Seguridad"),local(
                          "Защиту можно настроить PIN-кодом, паролем, графическим ключом или системной защитой устройства. Биометрия используется только если она настроена в системе. Для отключения защиты требуется действующий способ разблокировки.",
                          "Protection can use a PIN, password, pattern or device credential. Biometrics work only when configured in the system. Disabling protection requires the current unlock method.",
                          "Koruma PIN, parola, desen veya cihaz kimlik bilgisi ile kullanılabilir. Biyometri sistemde yapılandırılmış olmalıdır.",
                          "La protección puede usar PIN, contraseña, patrón o credencial del dispositivo. La biometría debe estar configurada en el sistema."));

                  expandable(content,local("10. Обратная связь и файлы","10. Feedback and files","10. Geri bildirim ve dosyalar","10. Comentarios y archivos"),local(
                          "В «О приложении» можно сообщить об ошибке или предложить улучшение. К обращению можно временно прикрепить фото или видео для объяснения проблемы. Приложение не должно хранить эти файлы после отправки: в истории обращений остаются только название, дата, тип и текст. Также в «О приложении» есть кнопка «Оценить приложение». После нескольких реально оплаченных платежей приложение может изредка ненавязчиво предложить поставить оценку; «Не сейчас» откладывает предложение.",
                          "About lets you report a bug or suggest an improvement and temporarily attach photos or video. Attachments are not kept after sending; request history keeps only title, date, type and text. About also contains Rate the app, and an occasional rating prompt may appear after real usage.",
                          "Hata bildirirken fotoğraf veya video geçici olarak eklenebilir; gönderimden sonra dosyalar saklanmaz. Geçmişte yalnızca metin kalır.",
                          "Al informar de un problema se pueden adjuntar temporalmente fotos o vídeos; los archivos no se guardan después del envío. El historial conserva solo texto."));

                  expandable(content,local("11. Важно о точности расчётов","11. Important calculation note","11. Hesaplama doğruluğu hakkında","11. Nota importante sobre los cálculos"),local(
                          "Все финансовые показатели приложения носят ориентировочный информационный характер. Фактические платежи, проценты, остаток долга, штрафы, комиссии, досрочное погашение, экономия и доход по вкладам могут отличаться от данных банка. Для точных значений используйте договор и информацию банка.",
                          "All financial figures are estimates for information. Actual payments, interest, balances, penalties, fees, early repayment, savings and deposit income may differ from bank data. Use your contract and bank information for exact values.",
                          "Tüm finansal değerler yaklaşık ve bilgilendirme amaçlıdır. Kesin değerler için banka sözleşmesini kullanın.",
                          "Todos los valores financieros son aproximados e informativos. Para cifras exactas, usa el contrato y los datos del banco."));

