          early_method='''    public static void applyEarlyRepayment(Context c,long id,long date,double prepayment,boolean reduceTerm,double customPayment,int customMonths){List<PaymentReminder> items=loadAll(c);for(PaymentReminder r:items)if(r.id==id){EarlyRepaymentSimulation sim=simulateEarlyRepayment(r,date,prepayment);cancel(c,r);double oldPayment=paymentAmount(r,Math.max(0,nextPaymentIndex(r)));int oldMonths=Math.max(1,remainingPaymentsAfterDate(r,date));double oldRate=r.annualRate;double trackedPaid=trackedSegmentPaid(r);double trackedRemaining=Math.max(0,r.progressTrackPrincipal-trackedPaid);r.progressRepaidBefore=Math.min(progressOriginalPrincipal(r),r.progressRepaidBefore+trackedPaid);double trackedPrepay=Math.min(sim.prepayment,trackedRemaining);r.progressRepaidBefore=Math.min(progressOriginalPrincipal(r),r.progressRepaidBefore+trackedPrepay);r.progressTrackPrincipal=Math.max(0,trackedRemaining-trackedPrepay);r.interestPaidBefore+=segmentPaidInterest(r);r.updatedAt=System.currentTimeMillis();String before="Остаток до погашения: "+round2(sim.balance)+" ₽\\nДосрочно внесено: "+round2(sim.prepayment)+" ₽";double saving;int afterMonths;double afterPayment;if(sim.newBalance<=.01){saving=sim.oldRemainingInterest;r.progressRepaidBefore=progressOriginalPrincipal(r);r.progressTrackPrincipal=0;r.principal=0;r.amount=0;r.firstPaymentMillis=date;r.months=1;r.ledgerJson="";r.ledgerCache=new ArrayList<>();r.partsCache=null;r.status=STATUS_ARCHIVE;afterMonths=0;afterPayment=0;appendHistory(r,r.updatedAt,HISTORY_EARLY,"Полное досрочное погашение","Full early repayment",before+"\\nКредит полностью погашен.\\nЭкономия на процентах: "+round2(saving)+" ₽","Loan fully repaid. Estimated interest saving: "+round2(saving)+" ₽");}else{r.principal=sim.newBalance;r.firstPaymentMillis=sim.firstFuturePayment;r.ledgerJson="";r.ledgerCache=new ArrayList<>();r.partsCache=null;if(reduceTerm){r.months=customMonths>0?customMonths:Math.max(1,sim.reducedMonths);r.amount=customPayment>0?custom