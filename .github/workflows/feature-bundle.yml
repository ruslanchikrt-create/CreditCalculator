name: Apply accumulated improvements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply feature bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace(text, old, new, name):
              if old not in text:
                  print('SKIP missing:', name)
                  return text
              return text.replace(old, new)
          def sub(text, pattern, repl, name, flags=re.S):
              new, n = re.subn(pattern, repl, text, flags=flags)
              if n == 0: print('SKIP regex:', name)
              else: print('patched', name, n)
              return new

          # ---------------- ReminderScheduler: performance, progress, benefits, notifications ----------------
