          # Append new sections before return of build.
          marker='        return root;'
          extra='''        section(content,"18",local("Прогресс после досрочного погашения и рефинансирования","Progress after early repayment and refinancing","Erken ödeme ve yeniden finansman sonrası ilerleme","Progreso tras pago anticipado y refinanciación"),local("Шкала погашения всегда считается от исходного основного долга. Досрочное погашение увеличивает уже погашенную часть, а рефинансирование сохраняет достигнутый прогресс. Смена условий больше не обнуляет процент и сумму погашенного основного долга.","Repayment progress is always measured from the original principal. Early repayment increases the repaid portion and refinancing preserves the achieved progress. Changing terms no longer resets the percentage or repaid-principal amount.","İlerleme her zaman ilk anapara üzerinden hesaplanır. Erken ödeme ilerlemeyi artırır, yeniden finansman ise mevcut ilerlemeyi korur.","El progreso se calcula siempre sobre el capital original. El pago anticipado aumenta lo amortizado y la refinanciación conserva el progreso."));\n        section(content,"19",local("Ваша выгода","Your savings","Kazancınız","Tu ahorro"),local("На главном экране показана общая расчётная выгода от применённых досрочных погашений и рефинансирований. Нажмите на карточку, чтобы открыть историю всех действий: дату, кредит, экономию, изменение платежа, срока и ставки. В карточке конкретного кредита также есть шкала снижения будущей переплаты.","The home screen shows total estimated savings from applied early repayments and refinancing. Tap the card to see the full history with date, loan, savings and changes in payment, term and rate. Each loan also has a scale for reduced future interest.","Ana ekranda erken ödeme ve yeniden finansmandan tahmini toplam kazanç gösterilir. Karttan ayrıntılı geçmiş açılır.","La pantalla principal muestra el ahorro estimado total de pagos anticipados y refinanciaciones. Toca la tarjeta para ver el historial."));\n        section(content,"20",local("Досрочный платёж","Early payment","Erken ödeme","Pago anticipado"),local("Раздел «Досрочный платёж» — отдельный калькулятор. Введите свободную сумму, например 1 000 ₽. Приложение сравнит все активные кредиты и покажет, куда выгоднее направить эти деньги, какую экономию на процентах это даст и что выгоднее — сократить срок или уменьшить платёж. Этот экран ничего не меняет в графиках. Чтобы применить досрочное погашение: Мои платежи → нужный кредит → Досрочное погашение. Рефинансирование применяется из того же экрана кредита.","Early payment is a separate comparison calculator. Enter a spare amount, for example 1,000. The app compares active debts, estimates where the money saves the most interest and whether reducing the term or payment is better. This screen changes nothing. To apply an early repayment: My payments → loan → Early repayment. Refinancing is applied from the same loan screen.","Erken ödeme ayrı bir karşılaştırma hesaplayıcısıdır. Serbest tutarı girin; uygulama aktif kredileri karşılaştırır. Bu ekran planları değiştirmez.","Pago anticipado es una calculadora de comparación. Introduce una cantidad libre; la app compara los créditos activos. Esta pantalla no cambia los calendarios."));\n        section(content,"21",local("Значок ⓘ","ⓘ help icon","ⓘ yardım simgesi","Icono de ayuda ⓘ"),local("Значок ⓘ находится рядом с названием параметра. Нажмите его, чтобы увидеть короткое объяснение поля или функции. Отдельная надпись «Подсказка» не используется.","The ⓘ icon is placed beside the parameter name. Tap it for a short explanation of the field or function. A separate Help label is not used.","ⓘ simgesi parametre adının yanında bulunur ve kısa açıklamayı açar.","El icono ⓘ aparece junto al nombre del parámetro y abre una explicación breve."));\n'''
          if 'Раздел «Досрочный платёж» — отдельный калькулятор' not in s:
              s=s.replace(marker,extra+marker,1)
          write(p,s)

          # ---------------- Manifest + version ----------------
          p='app/src/main/AndroidManifest.xml'; s=read(p)
          if '.EarlyPaymentAdvisorActivity' not in s:s=s.replace('        <activity android:name=".EarlyRepaymentActivity" android:exported="false" android:windowSoftInputMode="adjustResize" />','        <activity android:name=".EarlyRepaymentActivity" android:exported="false" android:windowSoftInputMode="adjustResize" />\n        <activity android:name=".EarlyPaymentAdvisorActivity" android:exported="false" android:windowSoftInputMode="adjustResize" />\n        <activity android:name=".BenefitHistoryActivity" android:exported="false" android:windowSoftInputMode="adjustResize" />')
          write(p,s)
          p='app/build.gradle'; s=read(p);s=s.replace('versionCode 11','versionCode 12').replace('versionName "1.11"','versionName "1.12"');write(p,s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement accumulated UX, savings and reminder improvements"
          git push
