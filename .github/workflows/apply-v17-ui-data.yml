name: Apply v1.7 UI Data Patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v17-ui-data.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MainActivity and SettingsActivity
        shell: python
        run: |
          from pathlib import Path

          main_path = Path('app/src/main/java/com/example/creditcalculator/MainActivity.java')
          main = main_path.read_text(encoding='utf-8')

          main = main.replace(
              '    private double lastPrincipal;\n    private double lastRate;',
              '    private double lastPrincipal;\n    private double lastBaseAmount;\n    private double lastDownPayment;\n    private double lastInsurance;\n    private double lastRate;')

          main = main.replace(
              '''    private Spinner createTermSpinner() {\n        Spinner spinner = new Spinner(this);\n        spinner.setBackgroundResource(android.R.drawable.editbox_background);\n        spinner.setPadding(dp(8), 0, dp(8), 0);\n        spinner.setVisibility(View.GONE);\n        return spinner;\n    }''',
              '''    private Spinner createTermSpinner() {\n        Spinner spinner = new Spinner(this);\n        UiUtils.styleSpinner(this, spinner);\n        spinner.setVisibility(View.GONE);\n        return spinner;\n    }''')

          main = main.replace(
              '''    private ArrayAdapter<String> createTermAdapter(int value) {\n        return new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item,\n        new java.util.ArrayList<>(java.util.Arrays.asList(\n                UiUtils.termUnit(this, value, false),\n                UiUtils.termUnit(this, value, true))));\n    }''',
              '''    private ArrayAdapter<String> createTermAdapter(int value) {\n        return UiUtils.spinnerAdapter(this, new java.util.ArrayList<>(java.util.Arrays.asList(\n                UiUtils.termUnit(this, value, false),\n                UiUtils.termUnit(this, value, true))));\n    }''')

          main = main.replace(
              '''        lastPrincipal = 0;\n        lastRate = 0;''',
              '''        lastPrincipal = 0;\n        lastBaseAmount = 0;\n        lastDownPayment = 0;\n        lastInsurance = 0;\n        lastRate = 0;''')

          main = main.replace(
              '''        double[] values = annuity(principal, months, rate);\n        remember(principal, rate, months, values[0]);''',
              '''        double[] values = annuity(principal, months, rate);\n        lastBaseAmount = principal;\n        lastDownPayment = 0;\n        lastInsurance = 0;\n        remember(principal, rate, months, values[0]);''', 1)

          mortgage_old = '''        double principal = price - down;\n        double[] values = annuity(principal, months, rate);\n        remember(principal, rate, months, values[0]);'''
          mortgage_new = '''        double principal = price - down;\n        double[] values = annuity(principal, months, rate);\n        lastBaseAmount = price;\n        lastDownPayment = down;\n        lastInsurance = 0;\n        remember(principal, rate, months, values[0]);'''
          main = main.replace(mortgage_old, mortgage_new, 1)
          main = main.replace(mortgage_old, mortgage_new, 1)

          main = main.replace(
              '''        double principal = price - down;\n        double payment = principal / months;\n        remember(principal, 0, months, payment);''',
              '''        double principal = price - down;\n        double payment = principal / months;\n        lastBaseAmount = price;\n        lastDownPayment = down;\n        lastInsurance = 0;\n        remember(principal, 0, months, payment);''')

          main = main.replace(
              '''        double income = finalAmount - principal;\n        remember(principal, rate, months, 0);''',
              '''        double income = finalAmount - principal;\n        lastBaseAmount = principal;\n        lastDownPayment = 0;\n        lastInsurance = 0;\n        remember(principal, rate, months, 0);''')

          main = main.replace(
              '''        if (lastPrincipal > 0) {\n            intent.putExtra(AddReminderActivity.EXTRA_PRINCIPAL, lastPrincipal);\n            intent.putExtra(AddReminderActivity.EXTRA_RATE, lastRate);\n        }''',
              '''        if (lastPrincipal > 0) {\n            intent.putExtra(AddReminderActivity.EXTRA_PRINCIPAL, lastPrincipal);\n            intent.putExtra(AddReminderActivity.EXTRA_BASE_AMOUNT, lastBaseAmount > 0 ? lastBaseAmount : lastPrincipal);\n            intent.putExtra(AddReminderActivity.EXTRA_DOWN_PAYMENT, lastDownPayment);\n            intent.putExtra(AddReminderActivity.EXTRA_INSURANCE, lastInsurance);\n            intent.putExtra(AddReminderActivity.EXTRA_RATE, lastRate);\n        }''')

          main = main.replace(
              '''        layout.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);\n        layout.setBoxCornerRadii(dp(14), dp(14), dp(14), dp(14));''',
              '''        layout.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);\n        layout.setBoxBackgroundColor(ContextCompat.getColor(this, R.color.card_background));\n        layout.setBoxStrokeColor(ContextCompat.getColor(this, R.color.primary));\n        layout.setHintTextColor(ColorStateList.valueOf(ContextCompat.getColor(this, R.color.text_secondary)));\n        layout.setBoxCornerRadii(dp(14), dp(14), dp(14), dp(14));''')

          main = main.replace(
              '''        input.setSingleLine(true);\n        input.setMinHeight(dp(58));\n        layout.addView(input, new TextInputLayout.LayoutParams(-1, -2));''',
              '''        input.setSingleLine(true);\n        input.setMinHeight(dp(58));\n        input.setTextColor(ContextCompat.getColor(this, R.color.text_main));\n        input.setHintTextColor(ContextCompat.getColor(this, R.color.text_secondary));\n        layout.addView(input, new TextInputLayout.LayoutParams(-1, -2));''')

          main_path.write_text(main, encoding='utf-8')

          settings_path = Path('app/src/main/java/com/example/creditcalculator/SettingsActivity.java')
          settings = settings_path.read_text(encoding='utf-8')
          settings = settings.replace(
              '''        languageSpinner = new Spinner(this);\n        languageSpinner.setBackgroundResource(android.R.drawable.editbox_background);\n        languageSpinner.setPadding(dp(12), 0, dp(12), 0);\n        languageSpinner.setAdapter(new ArrayAdapter<>(this,\n                android.R.layout.simple_spinner_dropdown_item,\n                new String[]{"Русский", "English"}));''',
              '''        languageSpinner = new Spinner(this);\n        UiUtils.styleSpinner(this, languageSpinner);\n        languageSpinner.setAdapter(UiUtils.spinnerAdapter(this, new String[]{"Русский", "English"}));''')
          settings_path.write_text(settings, encoding='utf-8')

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          import re
          gradle = re.sub(r'versionCode\s+\d+', 'versionCode 8', gradle, count=1)
          gradle = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.7"', gradle, count=1)
          gradle_path.write_text(gradle, encoding='utf-8')

      - name: Validate patch
        run: |
          grep -q 'EXTRA_DOWN_PAYMENT' app/src/main/java/com/example/creditcalculator/MainActivity.java
          grep -q 'UiUtils.spinnerAdapter' app/src/main/java/com/example/creditcalculator/SettingsActivity.java
          grep -q 'versionName "1.7"' app/build.gradle
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator/MainActivity.java app/src/main/java/com/example/creditcalculator/SettingsActivity.java app/build.gradle
          git commit -m "Connect payment details and improve dark mode controls"
          git push
