name: Fix v1.12 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair accidental multiline Java strings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/creditcalculator/ReminderScheduler.java')
          source = path.read_text(encoding='utf-8')

          def sanitize(segment):
              out = []
              in_string = False
              escaped = False
              for ch in segment:
                  if in_string and ch == '\n':
                      out.append('\\n')
                      escaped = False
                      continue
                  out.append(ch)
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                  elif ch == '"':
                      in_string = True
              return ''.join(out)

          ranges = [
              (
                  '    public static void applyEarlyRepayment(Context c,long id,long date,double prepayment,boolean reduceTerm,double customPayment,int customMonths)',
                  '\n\n    public static RefinanceSimulation simulateRefinance'
              ),
              (
                  '    public static void applyRefinance(Context c,long id,long date,double newRate,int newMonths,double commission,double insurance,double requestedPrincipal,String paymentType)',
                  '\n\n    public static double annuity'
              )
          ]

          for start_marker, end_marker in ranges:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              source = source[:start] + sanitize(source[start:end]) + source[end:]

          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator/ReminderScheduler.java
          if git diff --cached --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git commit -m "Repair v1.12 Java string literals"
          git push
