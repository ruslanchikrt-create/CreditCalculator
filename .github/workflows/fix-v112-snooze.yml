name: Fix v1.12 snooze scheduling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cancel original alarm when user postpones
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/creditcalculator/ReminderScheduler.java')
          source = path.read_text(encoding='utf-8')
          old = 'writeLedger(r,l);r.updatedAt=System.currentTimeMillis();saveRaw(c,items);Context app=c.getApplicationContext();PaymentReminder snap=alarmSnapshot(r);'
          new = 'writeLedger(r,l);r.updatedAt=System.currentTimeMillis();saveRaw(c,items);cancelInstallment(c,r,index);Context app=c.getApplicationContext();PaymentReminder snap=alarmSnapshot(r);'
          if old not in source:
              raise SystemExit('snooze block not found')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/creditcalculator/ReminderScheduler.java
          git commit -m "Cancel original payment alarm when snoozed"
          git push
