name: V116 Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v1.16 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              return text.replace(old,new,1)

          # Version + pull-to-refresh dependency.
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          s=rep(s,'versionCode 15','versionCode 16','versionCode')
          s=rep(s,'versionName "1.15"','versionName "1.16"','versionName')
          s=rep(s,"    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'\n","    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'\n    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'\n",'swipe dependency')
          p.write_text(s,encoding='utf-8')

          # Calculator screen: remove Early payment tile and floating + only here.
          p=Path('app/src/main/java/com/example/creditcalculator/MainActivity.java'); s=p.read_text(encoding='utf-8')
          s=rep(s,'    private MaterialButton creditBtn, mortgageBtn, autoBtn, installmentBtn, depositBtn, earlyPaymentBtn;','    private MaterialButton creditBtn, mortgageBtn, autoBtn, installmentBtn, depositBtn;','main button fields')
          old='creditBtn=calcButton(AppPreferences.tr(this,"Кредит","Loan"));mortgageBtn=calcButton(AppPreferences.tr(this,"Ипотека","Mortgage"));autoBtn=calcButton(AppPreferences.tr(this,"Автокредит","Auto loan"));installmentBtn=calcButton(AppPreferences.tr(this,"Рассрочка","Installment"));depositBtn=calcButton(AppPreferences.tr(this,"Вклад","Deposit"));earlyPaymentBtn=calcButton(AppPreferences.tr(this,"Досрочный платёж","Early payment"));content.addView(creditBtn,calcParams());content.addView(mortgageBtn,calcParams());content.addView(autoBtn,calcParams());content.addView(installmentBtn,calcParams());content.addView(depositBtn,calcParams());content.addView(earlyPaymentBtn,calcParams());'
          new='creditBtn=calcButton(AppPreferences.tr(this,"Кредит","Loan"));mortgageBtn=calcButton(AppPreferences.tr(this,"Ипотека","Mortgage"));autoBtn=calcButton(AppPreferences.tr(this,"Автокредит","Auto loan"));installmentBtn=calcButton(AppPreferences.tr(this,"Рассрочка","Installment"));depositBtn=calcButton(AppPreferences.tr(this,"Вклад","Deposit"));content.addView(creditBtn,calcParams());content.addView(mortgageBtn,calcParams());content.addView(autoBtn,calcParams());content.addView(installmentBtn,calcParams());content.addView(depositBtn,calcParams());'
          s=rep(s,old,new,'calculator tiles')
          s=rep(s,'creditBtn.setOnClickListener(v->select(Mode.CREDIT));mortgageBtn.setOnClickListener(v->select(Mode.MORTGAGE));autoBtn.setOnClickListener(v->select(Mode.AUTO));installmentBtn.setOnClickListener(v->select(Mode.INSTALLMENT));depositBtn.setOnClickListener(v->select(Mode.DEPOSIT));earlyPaymentBtn.setOnClickListener(v->startActivity(new Intent(this,EarlyPaymentAdvisorActivity.class)));','creditBtn.setOnClickListener(v->select(Mode.CREDIT));mortgageBtn.setOnClickListener(v->select(Mode.MORTGAGE));autoBtn.setOnClickListener(v->select(Mode.AUTO));installmentBtn.setOnClickListener(v->select(Mode.INSTALLMENT));depositBtn.setOnClickListener(v->select(Mode.DEPOSIT));','calculator listeners')
          plus='        MaterialButton plus=new MaterialButton(this);plus.setText("+");plus.setAllCaps(false);plus.setTextSize(30);plus.setTextColor(Color.WHITE);plus.setMinWidth(0);plus.setBackgroundTintList(ColorStateList.valueOf(ContextCompat.getColor(this,R.color.primary)));plus.setCornerRadius(dp(30));plus.setOnClickListener(v->openAdd());FrameLayout.LayoutParams pp=new FrameLayout.LayoutParams(dp(60),dp(60),Gravity.BOTTOM|Gravity.END);pp.setMargins(0,0,dp(20),dp(20));frame.addView(plus,pp);\n'
          s=rep(s,plus,'','calculator floating plus')
          p.write_text(s,encoding='utf-8')

          # Force a fresh read from local storage and rebuild reminders/notification state.
          p=Path('app/src/main/java/com/example/creditcalculator/ReminderScheduler.java'); s=p.read_text(encoding='utf-8')
          anchor='    public static List<PaymentReminder> load(Context context) { return listByStatus(context, STATUS_ACTIVE); }\n'
          addition='''    public static List<PaymentReminder> load(Context context) { return listByStatus(context, STATUS_ACTIVE); }\n\n    /** Re-read all persisted data and rebuild derived reminder state. Used by pull-to-refresh. */\n    public static void refreshAll(Context context) {\n        synchronized (STORE_LOCK) { cachedJson = null; cachedItems = null; }\n        List<PaymentReminder> all = loadAll(context);\n        for (PaymentReminder r : all) {\n            if (TYPE_DEPOSIT.equals(normalizeType(r.type))) continue;\n            for (int i = 0; i < r.months; i++) if (isPaid(r, i)) PaymentNotificationHelper.cancel(context, r.id, i);\n        }\n        rescheduleAll(context);\n    }\n'''
          s=rep(s,anchor,addition,'scheduler refreshAll')
          p.write_text(s,encoding='utf-8')

          # My payments: summary first, savings below; due-this-month means still due; pull-to-refresh refreshes the whole local model.
          p=Path('app/src/main/java/com/example/creditcalculator/PaymentsActivity.java'); s=p.read_text(encoding='utf-8')
          s=rep(s,'import androidx.core.view.WindowInsetsCompat;\n','import androidx.core.view.WindowInsetsCompat;\nimport androidx.swiperefreshlayout.widget.SwipeRefreshLayout;\n','SwipeRefresh import')
          s=rep(s,'    private LinearLayout listContainer;\n','    private LinearLayout listContainer;\n    private SwipeRefreshLayout swipeRefresh;\n','SwipeRefresh field')
          old='TextView add=top("+",32);add.setOnClickListener(v->startActivity(new Intent(this,AddReminderActivity.class)));bar.addView(add,new LinearLayout.LayoutParams(dp(64),dp(58)));ScrollView scroll=new ScrollView(this);scroll.setFillViewport(true);root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1f));listContainer=new LinearLayout(this);listContainer.setOrientation(LinearLayout.VERTICAL);listContainer.setPadding(dp(20),dp(22),dp(20),dp(28));scroll.addView(listContainer,new ScrollView.LayoutParams(-1,-2));'
          new='TextView add=top("+",32);add.setOnClickListener(v->startActivity(new Intent(this,AddReminderActivity.class)));bar.addView(add,new LinearLayout.LayoutParams(dp(64),dp(58)));swipeRefresh=new SwipeRefreshLayout(this);swipeRefresh.setColorSchemeResources(R.color.primary);root.addView(swipeRefresh,new LinearLayout.LayoutParams(-1,0,1f));ScrollView scroll=new ScrollView(this);scroll.setFillViewport(true);swipeRefresh.addView(scroll,new SwipeRefreshLayout.LayoutParams(-1,-1));listContainer=new LinearLayout(this);listContainer.setOrientation(LinearLayout.VERTICAL);listContainer.setPadding(dp(20),dp(22),dp(20),dp(28));scroll.addView(listContainer,new ScrollView.LayoutParams(-1,-2));swipeRefresh.setOnRefreshListener(this::refreshAllData);'
          s=rep(s,old,new,'Payments build refresh layout')
          old='List<ReminderScheduler.PaymentReminder> all=ReminderScheduler.load(this);listContainer.addView(benefitSummary(),benefitParams());listContainer.addView(summary(all));listContainer.addView(controls(),controlsParams());'
          new='List<ReminderScheduler.PaymentReminder> all=ReminderScheduler.load(this);listContainer.addView(summary(all));listContainer.addView(benefitSummary(),benefitParams());listContainer.addView(controls(),controlsParams());'
          s=rep(s,old,new,'summary before benefit')
          s=rep(s,'private LinearLayout.LayoutParams benefitParams(){LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,0,0,dp(16));return p;}','private LinearLayout.LayoutParams benefitParams(){LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,dp(16),0,0);return p;}','benefit margin')
          s=rep(s,'addLabelValue(box,AppPreferences.tr(this,"Общий остаток долга","Total remaining debt"),FormatUtils.money(this,debt),25,R.color.text_main);addLabelValue(box,AppPreferences.tr(this,"К оплате в этом месяце","Due this month"),FormatUtils.money(this,due),21,R.color.primary);','addLabelValue(box,AppPreferences.tr(this,"Общий остаток долга","Total remaining debt"),FormatUtils.money(this,debt),25,R.color.text_main);addLabelValue(box,AppPreferences.tr(this,"К оплате в этом месяце","Due this month"),FormatUtils.money(this,remainMonth),21,remainMonth>0?R.color.primary:R.color.success);','due month outstanding')
          marker='    private View benefitSummary(){'
          refresh='''    private void refreshAllData(){\n        try {\n            ReminderScheduler.refreshAll(this);\n            render();\n        } finally {\n            if(swipeRefresh!=null) swipeRefresh.setRefreshing(false);\n        }\n    }\n\n    private View benefitSummary(){'''
          s=rep(s,marker,refresh,'refresh method')
          p.write_text(s,encoding='utf-8')

          # Instruction: reflect page order, pull-to-refresh, calculator cleanup and monthly due semantics.
          p=Path('app/src/main/java/com/example/creditcalculator/InstructionActivity.java'); s=p.read_text(encoding='utf-8')
          s=rep(s,'Доступны кредит, ипотека, автокредит, рассрочка и вклад. Для кредита, ипотеки, автокредита и рассрочки можно указать страховку.','На странице «Калькуляторы» доступны кредит, ипотека, автокредит, рассрочка и вклад. Досрочный платёж выполняется из соответствующего раздела записи/меню, а добавление новой записи — кнопкой + в «Мои платежи». Для кредита, ипотеки, автокредита и рассрочки можно указать страховку.','instruction calculators RU')
          old='В «Мои платежи» показаны общий остаток долга, сумма к оплате в этом месяце, фактически оплаченные в текущем месяце платежи, остаток и просрочка. Сумма «Оплачено по графику» сохраняется в истории и не пропадает после досрочного погашения или рефинансирования.'
          new='В «Мои платежи» первой показывается «Общая сводка»: общий остаток долга, фактически оставшаяся к оплате сумма в текущем месяце, оплаченные в текущем месяце платежи, остаток и просрочка. После полной оплаты месяца строка «К оплате в этом месяце» становится 0 ₽. Сумма «Оплачено по графику» сохраняется в истории и не пропадает после досрочного погашения или рефинансирования.'
          s=rep(s,old,new,'instruction summary RU')
          old='Здесь же находится карточка «Ваша выгода» с общей экономией от досрочных погашений и рефинансирований.'
          new='Ниже общей сводки находится карточка «Ваша выгода» с общей экономией от досрочных погашений и рефинансирований. Потяните страницу «Мои платежи» вниз, чтобы принудительно перечитать все локальные записи, пересчитать сводку и производные расчёты, очистить уведомления уже оплаченных платежей и заново запланировать актуальные напоминания. Обновление относится к общей модели данных приложения, поэтому следующие открываемые экраны используют уже обновлённые данные.'
          s=rep(s,old,new,'instruction refresh RU')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build
        run: gradle testDebugUnitTest assembleDebug
      - name: Commit v1.16 and remove temporary workflow
        run: |
          rm .github/workflows/v116-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve payments home and refresh v1.16"
          git push
